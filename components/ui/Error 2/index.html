<div class="error-page">

    <div class="error-illustration">

        <div class="back-wall"></div>
        <div class="floor"></div>

        <!-- Plant -->
        <div class="plant">
            <div class="leaf leaf-one"></div>
            <div class="leaf leaf-two"></div>
            <div class="leaf leaf-three"></div>

            <div class="pot-rim"></div>
            <div class="pot"></div>
        </div>

        <!-- Background drawers -->
        <div class="drawers">
            <div class="drawer"></div>
            <div class="drawer"></div>
        </div>

        <!-- Ground shadow -->
        <div class="cup-shadow"></div>

        <!-- Spilled paper/liquid -->
        <div class="spill-surface"></div>

        <!-- Fallen cup -->
        <div class="cup">

            <div class="cup-body"></div>

            <div class="cup-opening"></div>

            <div class="cup-label"></div>

            <div class="coffee"></div>

        </div>

        <!-- Small detached object -->
        <div class="small-object"></div>

    </div>


    <!-- Error message -->
    <div class="error-content">

        <h1 class="error-title">
            Error!
        </h1>

        <p class="error-message">
            Something went wrong,<br>
            Please try again later
        </p>

        <button
            class="retry"
            type="button"
            onclick="location.reload()"
        >
            RETRY
        </button>

    </div>

</div>
