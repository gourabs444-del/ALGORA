<div class="guild-nav-wrapper">
  <!-- GUILD RANKING GLOWING GLASS DOCK -->
  <nav class="guild-dock-nav" id="guildDockNav">

    <!-- 1. HOME (DEFAULT ACTIVE - SOLID WHITE WITH ICON) -->
    <button type="button" class="guild-nav-btn active" onclick="switchGuildNav(this)">
      <svg class="guild-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span class="guild-nav-label">Home</span>
    </button>

    <!-- 2. OPTION 1 (NO SYMBOL) -->
    <button type="button" class="guild-nav-btn" onclick="switchGuildNav(this)">
      <span class="guild-nav-label">Option 1</span>
    </button>

    <!-- 3. OPTION 2 (NO SYMBOL) -->
    <button type="button" class="guild-nav-btn" onclick="switchGuildNav(this)">
      <span class="guild-nav-label">Option 2</span>
    </button>

    <!-- 4. OPTION 3 (NO SYMBOL) -->
    <button type="button" class="guild-nav-btn" onclick="switchGuildNav(this)">
      <span class="guild-nav-label">Option 3</span>
    </button>

    <!-- 5. OPTION 4 (NO SYMBOL) -->
    <button type="button" class="guild-nav-btn" onclick="switchGuildNav(this)">
      <span class="guild-nav-label">Option 4</span>
    </button>

    <!-- 6. OPTION 5 (NO SYMBOL) -->
    <button type="button" class="guild-nav-btn" onclick="switchGuildNav(this)">
      <span class="guild-nav-label">Option 5</span>
    </button>

  </nav>
</div>

<script>
  function switchGuildNav(el) {
    var buttons = document.querySelectorAll('.guild-nav-btn');
    buttons.forEach(function(btn) {
      btn.classList.remove('active');
    });
    if (el) {
      el.classList.add('active');
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    var buttons = document.querySelectorAll('.guild-nav-btn');
    buttons.forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        switchGuildNav(this);
      });
    });
  });
</script>
