    <button type="button" class="guild-nav-btn" onclick="switchGuildNav(this)">

    <button type="button" class="guild-nav-btn active" onclick="switchGuildNav(this)">
      <svg class="guild-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="7" height="7" x="3" y="3" rx="1.5"/>

        <rect width="7" height="7" x="14" y="14" rx="1.5"/>

  </nav>
</div>

<script>
  function switchGuildNav(el) {
    var buttons = document.querySelectorAll('.guild-nav-btn');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.remove('active');
    }
    if (el) {
      el.classList.add('active');
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    var buttons = document.querySelectorAll('.guild-nav-btn');
    buttons.forEach(function(btn) {
      btn.addEventListener('click', function() {
        switchGuildNav(this);
      });
    });
  });
</script>
