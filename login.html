<script>
    (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
        } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
        }
    })();
</script>

<script>
    let mode = 'signin';

    // Parse redirects
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect') || 'projects.html';

    function showSuccessAndRedirect() {
        let targetUrl = redirectUrl;
        if (targetUrl.includes('profile.html')) {
            targetUrl = 'projects.html';
        }

        const modal = document.getElementById('success-modal');
        const btn = document.getElementById('success-btn');
        if (modal && btn) {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            btn.addEventListener('click', () => {
                window.location.replace(targetUrl);
            });
            
            setTimeout(() => {
                window.location.replace(targetUrl);
            }, 1800);
        } else {
            window.location.replace(targetUrl);
        }
    }

    // Password toggle wire-up
    const passwordToggle = document.getElementById('password-toggle');
    const passwordInput = document.getElementById('auth-password');
    const eyeIcon = document.getElementById('eye-icon');
    if (passwordToggle && passwordInput && eyeIcon) {
        passwordToggle.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerText = 'visibility';
            }
        });
    }

    function toggleMode(targetMode) {
        if (mode === targetMode) return;
        mode = targetMode;

        const submitBtn = document.getElementById('submit-btn');
        const signupFields = document.getElementById('signup-fields');
        const confirmPasswordWrap = document.getElementById('confirm-password-wrap');
        const nameInput = document.getElementById('auth-name');
        const confirmPasswordInput = document.getElementById('auth-confirm-password');
        
        const tabSignin = document.getElementById('tab-signin');
        const tabSignup = document.getElementById('tab-signup');
        const authTabs = document.getElementById('auth-tabs');

        if (mode === 'signin') {
            submitBtn.innerHTML = `Sign In <span class="material-symbols-outlined text-[18px] font-bold">arrow_forward</span>`;
            signupFields.classList.remove('is-open');
            confirmPasswordWrap.classList.remove('is-open');
            nameInput.removeAttribute('required');
            confirmPasswordInput.removeAttribute('required');
            
            authTabs.dataset.mode = 'signin';
            tabSignin.className = "w-full text-center py-2.5 rounded-xl font-bold text-body-sm transition-all text-primary dark:text-white z-10 cursor-pointer active-feedback";
            tabSignup.className = "w-full text-center py-2.5 rounded-xl font-bold text-body-sm transition-all text-secondary dark:text-slate-400 z-10 cursor-pointer active-feedback";
            
            const forgotLink = document.getElementById('forgot-password-link');
            if (forgotLink) forgotLink.classList.remove('hidden');
        } else {
            submitBtn.innerHTML = `Create Account <span class="material-symbols-outlined text-[18px] font-bold">person_add</span>`;
            signupFields.classList.add('is-open');
            confirmPasswordWrap.classList.add('is-open');
            nameInput.setAttribute('required', 'required');
            confirmPasswordInput.setAttribute('required', 'required');
            
            authTabs.dataset.mode = 'signup';
            tabSignup.className = "w-full text-center py-2.5 rounded-xl font-bold text-body-sm transition-all text-primary dark:text-white z-10 cursor-pointer active-feedback";
            tabSignin.className = "w-full text-center py-2.5 rounded-xl font-bold text-body-sm transition-all text-secondary dark:text-slate-400 z-10 cursor-pointer active-feedback";
            
            const forgotLink = document.getElementById('forgot-password-link');
            if (forgotLink) forgotLink.classList.add('hidden');
        }
    }

    async function handleAuthSubmit(e) {
        e.preventDefault();
        if (!isFirebaseConfigured) {
            alert('Firebase configuration is still loading. Please try again in a moment.');
            return;
        }

        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        const confirmPassword = document.getElementById('auth-confirm-password').value;
        const name = document.getElementById('auth-name').value.trim();
        const submitBtn = document.getElementById('submit-btn');
        const originalButton = submitBtn.innerHTML;

        if (mode === 'signup' && password !== confirmPassword) {
            alert('Passwords do not match.');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-70', 'cursor-wait');
        submitBtn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span> Please wait`;

        try {
            let credential;
            if (mode === 'signup') {
                credential = await auth.createUserWithEmailAndPassword(email, password);
                await credential.user.updateProfile({ displayName: name });
            } else {
                credential = await auth.signInWithEmailAndPassword(email, password);
            }

            await saveAuthenticatedUser(credential.user, 'Portfolio User');
            showSuccessAndRedirect();
        } catch (error) {
            console.error('Firebase email authentication error:', error);
            const messages = {
                'auth/email-already-in-use': 'An account already exists with this email. Please sign in instead.',
                'auth/invalid-email': 'Please enter a valid email address.',
                'auth/weak-password': 'Use a password with at least 6 characters.',
                'auth/user-not-found': 'No account was found with this email.',
                'auth/wrong-password': 'The password is incorrect. Please try again.',
                'auth/invalid-credential': 'The email or password is incorrect.',
                'auth/operation-not-allowed': 'Enable Email/Password in Firebase Authentication first.'
            };
            alert(messages[error.code] || error.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-70', 'cursor-wait');
            submitBtn.innerHTML = originalButton;
        }
    }

    // ── FIREBASE AUTHENTICATION CONFIGURATION ──────────────────
    // Replace these placeholder details with your actual Firebase project config credentials.
    let isFirebaseConfigured = false;
    let auth;
    function initializeFirebaseAuth(config) {
        if (!config || !config.apiKey || isFirebaseConfigured) return;
        try {
            if (!firebase.apps.length) firebase.initializeApp(config);
            auth = firebase.auth();
            isFirebaseConfigured = true;
        } catch (error) {
            console.error("Firebase Initialization Failed:", error);
        }
    }

    // firebase-config.js dispatches this event once the project configuration is ready.
    initializeFirebaseAuth(window.firebaseConfig);
    window.addEventListener('firebase-config-ready', () => {
        initializeFirebaseAuth(window.firebaseConfig);
        handlePendingRedirectResult();
    }, { once: true });

    async function saveAuthenticatedUser(user, providerName) {
        let profile = null;
        if (window.PortfolioAuth) {
            try {
                profile = await window.PortfolioAuth.ensureUserProfile(user);
            } catch (profileError) {
                console.warn('Profile sync skipped after authentication:', profileError);
            }
        }
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('userName', (profile && profile.displayName) || user.displayName || `${providerName} User`);
        localStorage.setItem('userEmail', user.email || '');
        const avatar = window.PortfolioAuth ? window.PortfolioAuth.getAvatar(profile, user) : user.photoURL;
        if (avatar) localStorage.setItem('userPicture', avatar);
        else localStorage.removeItem('userPicture');
    }

    function getSocialProvider(providerName) {
        if (providerName === 'Google') {
            return new firebase.auth.GoogleAuthProvider();
        }
        if (providerName === 'Facebook') {
            return new firebase.auth.FacebookAuthProvider();
        }
        throw new Error('Unsupported sign-in provider.');
    }

    function showSocialAuthError(providerName, error) {
        console.error(`Firebase ${providerName} Sign-In Error:`, error);
        if (error.code === 'auth/popup-closed-by-user') return;
        alert(`${providerName} login failed: ${error.message}`);
    }

    async function finishSocialAuth(result, providerName) {
        if (!result || !result.user) return;

        await saveAuthenticatedUser(result.user, providerName);
        showSuccessAndRedirect();
    }

    function handleSocialAuth(providerName) {
        if (!isFirebaseConfigured) {
            alert('Real social login ke liye Firebase configuration add karein aur Firebase Console mein provider enable karein.');
            return;
        }

        const provider = getSocialProvider(providerName);
        // OAuth redirects are substantially more reliable in mobile browsers.
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        if (isMobile) {
            auth.signInWithRedirect(provider).catch((error) => showSocialAuthError(providerName, error));
            return;
        }

        auth.signInWithPopup(provider)
            .then((result) => finishSocialAuth(result, providerName))
            .catch((error) => showSocialAuthError(providerName, error));
    }

    // Finish a mobile redirect sign-in after the identity provider returns here.
    function handlePendingRedirectResult() {
        if (!isFirebaseConfigured || !auth) return;
        auth.getRedirectResult()
            .then((result) => {
                if (!result || !result.user) return;
                const providerName = result.credential && result.credential.providerId === 'facebook.com'
                        ? 'Facebook'
                        : 'Google';
                return finishSocialAuth(result, providerName);
            })
            .catch((error) => showSocialAuthError('Social', error));
    }
    handlePendingRedirectResult();

    function handleForgotPassword(e) {
        e.preventDefault();
        const emailInput = document.getElementById('auth-email').value;
        if (!emailInput) {
            alert("Please enter your email address first so we can send you a password reset link!");
            return;
        }

        if (!isFirebaseConfigured) {
            alert('Firebase configuration is still loading. Please try again in a moment.');
            return;
        }

        auth.sendPasswordResetEmail(emailInput)
            .then(() => alert(`A password reset link has been sent to: ${emailInput}`))
            .catch((error) => {
                console.error('Firebase password reset error:', error);
                alert(error.code === 'auth/user-not-found' ? 'No account was found with this email.' : error.message);
            });
    }
</script>
</body>
</html>
