<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>My Discounted Labs | Sign Up</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
    <style data-purpose="custom-styles">
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
        }
        
        .bg-gradient-custom {
            background: linear-gradient(135deg, #3B4B74 0%, #3B4B74 40%, #FA6A92 40%, #FA6A92 100%);
        }

        .bg-blue-gradient {
            background: linear-gradient(180deg, #62A4FF 0%, #4667FF 100%);
        }

        .form-input {
            border: none;
            border-bottom: 1px solid #E2E8F0;
            border-radius: 0;
            padding: 0.5rem 0;
            box-shadow: none !important;
        }
        
        .form-input:focus {
            border-bottom-color: #4F46E5;
            box-shadow: none !important;
            outline: none;
        }

        .tab-active {
            color: #374151;
            border-bottom: 2px solid #4F46E5;
        }
        
        .tab-inactive {
            color: #9CA3AF;
            border-bottom: 2px solid transparent;
        }
    </style>
</head>
<body class="bg-gradient-custom min-h-screen flex items-center justify-center p-4 md:p-8">

    <!-- BEGIN: Main Container -->
    <main class="w-full max-w-[1100px] min-h-[640px] md:h-[700px] bg-white rounded-3xl overflow-hidden shadow-2xl flex flex-col md:flex-row relative z-10" data-purpose="main-layout">
        
        <!-- BEGIN: Left Side (Image & Branding) -->
        <section class="w-full md:w-[45%] min-h-[260px] md:h-full bg-blue-gradient md:rounded-r-[40px] flex flex-col justify-between p-8 md:p-10 relative z-20 shadow-[10px_0_20px_rgba(0,0,0,0.05)] overflow-hidden" data-purpose="left-panel">
            
            <!-- Brand Logo -->
            <div class="flex items-center space-x-2 text-white relative z-30">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2l.5-.5m10.5-1.5c1.5-1.26 2-5 2-5s-3.74.5-5 2l-.5.5m-5-2v-8m0 0l-3 3m3-3l3 3" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                <span class="font-semibold text-lg tracking-wide">My Discounted Labs</span>
            </div>

            <!-- Custom SVG Graphic -->
            <div class="absolute inset-0 z-10 opacity-60 pointer-events-none">
                <svg height="100%" preserveAspectRatio="xMidYMid slice" viewBox="0 0 500 700" width="100%" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="hexGrad1" x1="0%" x2="100%" y1="0%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"></stop>
                            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"></stop>
                        </linearGradient>
                        <linearGradient id="hexGrad2" x1="100%" x2="0%" y1="0%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"></stop>
                            <stop offset="100%" stop-color="#8BB8FF" stop-opacity="0.1"></stop>
                        </linearGradient>
                        <g id="hexagon">
                            <polygon points="50,0 100,28.87 100,86.6 50,115.47 0,86.6 0,28.87"></polygon>
                        </g>
                        <g id="microscope">
                            <path d="M20,40 L20,30 C20,20 30,20 30,20 L30,15 C30,10 25,10 25,10 L15,10 C15,10 10,10 10,15 L10,35 C10,40 15,45 15,45 L25,45 C25,45 28,45 28,42 L25,40 Z" fill="none" stroke="#ffffff" stroke-width="2"></path>
                            <circle cx="15" cy="25" fill="none" r="4" stroke="#ffffff" stroke-width="2"></circle>
                            <line stroke="#ffffff" stroke-width="3" x1="5" x2="35" y1="50" y2="50"></line>
                        </g>
                        <g id="beaker">
                            <path d="M10,10 L30,10 L30,20 L35,45 C37,55 30,60 20,60 C10,60 3,55 5,45 L10,20 Z" fill="none" stroke="#ffffff" stroke-width="2"></path>
                            <line stroke="#ffffff" stroke-dasharray="2,2" stroke-width="1" x1="5" x2="35" y1="40" y2="40"></line>
                            <line stroke="#ffffff" stroke-dasharray="2,2" stroke-width="1" x1="8" x2="32" y1="30" y2="30"></line>
                        </g>
                    </defs>

                    <!-- Background hexagons (large) -->
                    <use fill="url(#hexGrad1)" href="#hexagon" opacity="0.3" transform="scale(2.5)" x="-20" y="50"></use>
                    <use fill="none" href="#hexagon" opacity="0.4" stroke="#ffffff" stroke-width="1" transform="scale(2)" x="120" y="-30"></use>
                    <use fill="url(#hexGrad2)" href="#hexagon" opacity="0.2" transform="scale(3)" x="80" y="180"></use>
                    <use fill="none" href="#hexagon" opacity="0.3" stroke="#ffffff" stroke-width="2" transform="scale(1.8)" x="-50" y="300"></use>
                    <use fill="url(#hexGrad1)" href="#hexagon" opacity="0.25" transform="scale(2.2)" x="150" y="400"></use>

                    <!-- Medium hexagons -->
                    <use fill="url(#hexGrad2)" href="#hexagon" x="50" y="100"></use>
                    <use fill="none" href="#hexagon" opacity="0.6" stroke="#ffffff" stroke-width="1.5" x="160" y="160"></use>
                    <use fill="url(#hexGrad1)" href="#hexagon" opacity="0.5" x="270" y="100"></use>
                    <use fill="none" href="#hexagon" opacity="0.4" stroke="#ffffff" stroke-width="2" x="220" y="270"></use>
                    <use fill="url(#hexGrad2)" href="#hexagon" opacity="0.7" x="60" y="350"></use>
                    <use fill="none" href="#hexagon" opacity="0.5" stroke="#ffffff" stroke-width="1" x="300" y="400"></use>
                    <use fill="url(#hexGrad1)" href="#hexagon" opacity="0.4" x="180" y="520"></use>
                    <use fill="url(#hexGrad2)" href="#hexagon" opacity="0.3" x="400" y="200"></use>

                    <!-- Small hexagons and icons -->
                    <use fill="#ffffff" href="#hexagon" opacity="0.4" transform="scale(0.5)" x="350" y="50"></use>
                    <use fill="none" href="#hexagon" opacity="0.7" stroke="#ffffff" stroke-width="3" transform="scale(0.6)" x="120" y="280"></use>
                    <use fill="url(#hexGrad1)" href="#hexagon" transform="scale(0.7)" x="420" y="350"></use>
                    <use fill="none" href="#hexagon" opacity="0.5" stroke="#ffffff" stroke-width="2" transform="scale(0.5)" x="80" y="550"></use>

                    <!-- Integrating icons inside hexagons -->
                    <g transform="translate(85, 135) scale(0.8)">
                        <use href="#beaker" opacity="0.8"></use>
                    </g>
                    <g transform="translate(305, 135) scale(0.8)">
                        <use href="#microscope" opacity="0.7"></use>
                    </g>
                    <g transform="translate(95, 385) scale(0.8)">
                        <use href="#microscope" opacity="0.9"></use>
                    </g>
                    <g transform="translate(215, 555) scale(0.8)">
                        <use href="#beaker" opacity="0.6"></use>
                    </g>
                </svg>
            </div>

            <!-- Copyright -->
            <div class="text-white/80 text-xs text-center pb-2 relative z-30">
                Copyright © 2019, My Discounted Labs. All rights reserved.
            </div>
        </section>
        <!-- END: Left Side -->

        <!-- BEGIN: Right Side (Form) -->
        <section class="w-full md:w-[55%] h-full bg-slate-50 flex flex-col justify-center items-center relative p-6 sm:p-8 md:p-10" data-purpose="right-panel">
            
            <!-- Form Card -->
            <div class="w-full max-w-[400px] bg-white rounded-3xl shadow-lg p-6 sm:p-8 relative z-10" data-purpose="login-form-card">
                
                <!-- Tabs -->
                <div class="flex space-x-6 mb-8 text-lg font-medium border-b border-gray-100 pb-2">
                    <button type="button" id="tab-signup" onclick="switchMode('signup')" class="tab-active pb-2 transition-colors">Sign Up</button>
                    <button type="button" id="tab-signin" onclick="switchMode('signin')" class="tab-inactive pb-2 hover:text-gray-700 transition-colors">Sign In</button>
                </div>

                <!-- Form -->
                <form id="auth-form" class="space-y-6" onsubmit="event.preventDefault();">
                    <div id="field-fullname">
                        <label class="block text-sm text-blue-500 font-medium mb-1">Full Name</label>
                        <input id="input-fullname" class="form-input w-full bg-transparent text-gray-700 text-sm focus:outline-none" placeholder="Aldrego" type="text"/>
                    </div>

                    <div>
                        <label class="block text-sm text-blue-500 font-medium mb-1">Email</label>
                        <input id="input-email" class="form-input w-full bg-transparent text-gray-700 text-sm focus:outline-none" placeholder="Aldrego@email.com" type="email" required/>
                    </div>

                    <div>
                        <label class="block text-sm text-blue-500 font-medium mb-1">Password</label>
                        <input id="input-password" class="form-input w-full bg-transparent text-gray-700 text-sm focus:outline-none" placeholder="•••••••••" type="password" required/>
                    </div>

                    <button id="btn-submit" class="w-full bg-blue-500 hover:bg-blue-600 active:scale-[0.98] text-white font-medium py-3 rounded-xl shadow-md shadow-blue-500/30 transition-all mt-8 cursor-pointer" type="submit">
                        Sign Up
                    </button>
                </form>

                <div class="text-center mt-6">
                    <a id="toggle-account-link" class="text-pink-400 text-sm hover:text-pink-500 transition-colors cursor-pointer" onclick="toggleMode()">
                        I have an Account ?
                    </a>
                </div>
            </div>

        </section>
        <!-- END: Right Side -->

    </main>
    <!-- END: Main Container -->

    <script>
        let currentMode = 'signup';

        function switchMode(mode) {
            currentMode = mode;
            const tabSignup = document.getElementById('tab-signup');
            const tabSignin = document.getElementById('tab-signin');
            const fieldFullName = document.getElementById('field-fullname');
            const btnSubmit = document.getElementById('btn-submit');
            const toggleLink = document.getElementById('toggle-account-link');

            if (mode === 'signup') {
                tabSignup.className = 'tab-active pb-2 transition-colors';
                tabSignin.className = 'tab-inactive pb-2 hover:text-gray-700 transition-colors';
                fieldFullName.style.display = 'block';
                btnSubmit.textContent = 'Sign Up';
                toggleLink.textContent = 'I have an Account ?';
            } else {
                tabSignin.className = 'tab-active pb-2 transition-colors';
                tabSignup.className = 'tab-inactive pb-2 hover:text-gray-700 transition-colors';
                fieldFullName.style.display = 'none';
                btnSubmit.textContent = 'Sign In';
                toggleLink.textContent = "Don't have an Account ? Sign Up";
            }
        }

        function toggleMode() {
            switchMode(currentMode === 'signup' ? 'signin' : 'signup');
        }
    </script>
</body>
</html>
