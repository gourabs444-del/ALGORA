<!DOCTYPE html>
<html class="light" lang="en">
<head>
<script>
    (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
        } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
        }
    })();
</script>

      transform: translate3d(0, 0, 0);
      transition: transform 260ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 260ms ease;
  }
  .auth-tabs[data-mode="signup"] .tab-pill {
      transform: translate3d(calc(100% + var(--tab-gap)), 0, 0);
  }
  
  /* Abstract Spotlight Grid Pattern Background */
  .bg-grid-pattern {
      position: relative;
  }
  .bg-grid-pattern::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
          linear-gradient(to right, rgba(99, 102, 241, 0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(99, 102, 241, 0.04) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: radial-gradient(ellipse 65% 55% at 50% 50%, #000 50%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 65% 55% at 50% 50%, #000 50%, transparent 100%);
      pointer-events: none;
      z-index: 1;
  }
  .dark .bg-grid-pattern::before {
      background-image: 
          linear-gradient(to right, rgba(99, 102, 241, 0.06) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(99, 102, 241, 0.06) 1px, transparent 1px);
  }

  /* Morphing organic background blobs */
  .artistic-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      mix-blend-mode: multiply;
      opacity: 0.55;
      animation: morph 20s infinite alternate ease-in-out;
      pointer-events: none;
      z-index: 0;
  }
  .dark .artistic-blob {
      mix-blend-mode: screen;
      opacity: 0.35;
      filter: blur(100px);
  }
  .blob-indigo {
      background: radial-gradient(circle, rgba(99,102,241,0.4) 0%, rgba(168,85,247,0.05) 70%);
      animation-duration: 25s;
  }
  .blob-rose {
      background: radial-gradient(circle, rgba(244,63,94,0.35) 0%, rgba(236,72,153,0.05) 70%);
      animation-duration: 30s;
  }
  .blob-cyan {
      background: radial-gradient(circle, rgba(6,182,212,0.3) 0%, rgba(59,130,246,0.05) 70%);
      animation-duration: 22s;
  }
  .blob-emerald {
      background: radial-gradient(circle, rgba(16,185,129,0.25) 0%, rgba(52,211,153,0.05) 70%);
      animation-duration: 28s;
  }
  .blob-violet {
      background: radial-gradient(circle, rgba(139,92,246,0.3) 0%, rgba(167,139,250,0.05) 70%);
      animation-duration: 32s;
  }

  /* Disabled Background Animations (100% Static Layout) */
  .artistic-blob,
  .animate-float-disk-1,
  .animate-float-disk-2,
  .animate-float-cube-1,
  .animate-float-cube-2,
  .animate-hover-tag,
  .animate-spin,
  .animate-pulse,
  .animate-ping {
      animation: none !important;
  }

  @keyframes morph {
      0% {
          border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
          transform: translate(0px, 0px) rotate(0deg) scale(1);
      }
      33% {

      }
      100% {
          border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
          transform: translate(0px, 0px) rotate(360deg) scale(1);
      }
  }

</style>

            <span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">vpn_key</span>
        </div>
        <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white leading-tight">Account Access</h2>
    </div>

    <div class="space-y-3 sm:space-y-5">
        <!-- Email Authentication -->
        <section class="email-panel rounded-[26px] border border-white/80 dark:border-slate-800 bg-white/72 dark:bg-slate-950/44 p-3.5 pb-4 sm:p-6 shadow-[0_14px_34px_rgba(15,23,42,0.08)]">

            <!-- Mode Toggles (Sliding Indicator Tab Layout) -->
            <div id="auth-tabs" data-mode="signin" class="auth-tabs relative grid grid-cols-2 gap-1.5 bg-slate-100 dark:bg-slate-900/60 p-1.5 rounded-2xl mb-3 sm:mb-6 border border-outline-variant/10 dark:border-slate-800/80">
                <div id="tab-pill" class="tab-pill absolute top-1.5 bottom-1.5 bg-white dark:bg-slate-800 rounded-xl shadow-[0_2px_8px_rgba(15,23,42,0.12)] z-0"></div>

                <button id="tab-signin" type="button" class="w-full text-center py-2.5 rounded-xl font-bold text-body-sm transition-all text-primary dark:text-white z-10 cursor-pointer active-feedback" onclick="toggleMode('signin')">
                    Sign In
                </button>
                <button id="tab-signup" type="button" class="w-full text-center py-2.5 rounded-xl font-bold text-body-sm transition-all text-secondary dark:text-slate-400 z-10 cursor-pointer active-feedback" onclick="toggleMode('signup')">
                    Sign Up
                </button>
            </div>

            <form class="space-y-3 sm:space-y-4" id="auth-form" onsubmit="handleAuthSubmit(event)">
                <div id="signup-fields" class="email-mode-fields">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-body-sm font-bold text-slate-600 dark:text-slate-300 mb-1.5" for="auth-name">Full Name</label>
                            <div class="relative focus-glow border border-outline-variant/30 dark:border-slate-800 rounded-2xl bg-slate-50 dark:bg-slate-900 transition-all">
                                <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary/60 text-[20px]">person</span>
                                <input id="auth-name" type="text" class="w-full bg-transparent border-0 focus:ring-0 rounded-2xl py-2.5 sm:py-3.5 pl-11 pr-4 text-body-sm outline-none text-slate-900 dark:text-white" placeholder="Enter your full name">
                            </div>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-body-sm font-bold text-slate-600 dark:text-slate-300 mb-1.5" for="auth-email">Email Address</label>
                    <div class="relative focus-glow border border-outline-variant/30 dark:border-slate-800 rounded-2xl bg-slate-50 dark:bg-slate-900 transition-all">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary/60 text-[20px]">mail</span>
                        <input id="auth-email" type="email" required class="w-full bg-transparent border-0 focus:ring-0 rounded-2xl py-2.5 sm:py-3.5 pl-11 pr-4 text-body-sm outline-none text-slate-900 dark:text-white" placeholder="Enter your email">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-body-sm font-bold text-slate-600 dark:text-slate-300" for="auth-password">Password</label>
                        <a href="#" id="forgot-password-link" onclick="handleForgotPassword(event)" class="text-xs font-semibold text-primary dark:text-blue-400 hover:underline">Forgot Password?</a>
                    </div>
                    <div class="relative focus-glow border border-outline-variant/30 dark:border-slate-800 rounded-2xl bg-slate-50 dark:bg-slate-900 transition-all">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary/60 text-[20px]">lock</span>
                        <input id="auth-password" type="password" required class="w-full bg-transparent border-0 focus:ring-0 rounded-2xl py-2.5 sm:py-3.5 pl-11 pr-12 text-body-sm outline-none text-slate-900 dark:text-white" placeholder="Enter your password">
                        <button type="button" id="password-toggle" class="absolute right-4 top-1/2 -translate-y-1/2 text-secondary/60 hover:text-primary dark:hover:text-blue-400 transition-colors cursor-pointer flex items-center justify-center" aria-label="Toggle Password Visibility">
                            <span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
                        </button>
                    </div>
                </div>

                <div id="confirm-password-wrap" class="email-mode-fields">
                    <div>
                        <label class="block text-body-sm font-bold text-slate-600 dark:text-slate-300 mb-1.5" for="auth-confirm-password">Confirm Password</label>
                        <div class="relative focus-glow border border-outline-variant/30 dark:border-slate-800 rounded-2xl bg-slate-50 dark:bg-slate-900 transition-all">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary/60 text-[20px]">verified_user</span>
                            <input id="auth-confirm-password" type="password" class="w-full bg-transparent border-0 focus:ring-0 rounded-2xl py-2.5 sm:py-3.5 pl-11 pr-4 text-body-sm outline-none text-slate-900 dark:text-white" placeholder="Confirm your password">
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-primary text-white font-bold py-3 sm:py-4 px-6 rounded-2xl shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-98 transition-all flex items-center justify-center gap-2 cursor-pointer mt-3.5 sm:mt-6" id="submit-btn">
                    Sign In <span class="material-symbols-outlined text-[18px] font-bold">arrow_forward</span>
                </button>
            </form>
        </section>

        <!-- Plain Text Divider Stack -->
        <div class="text-center my-3 sm:my-6 select-none flex flex-col gap-1">
            <span class="text-[10px] font-bold uppercase tracking-widest text-slate-500 dark:text-slate-400 leading-none">or</span>
            <span class="text-[10px] font-bold uppercase tracking-widest text-slate-500 dark:text-slate-400 leading-none">continue with</span>
        </div>

        <!-- OAuth Authentication -->
        <section class="oauth-panel rounded-[26px] border border-slate-200/70 dark:border-slate-800 bg-slate-950/[0.03] dark:bg-white/[0.035] p-3 sm:p-5">
            <div class="grid grid-cols-2 gap-2.5 sm:gap-3">
                <button type="button" onclick="handleSocialAuth('Google')" class="social-button flex items-center justify-center gap-1.5 sm:gap-3 py-2.5 px-2 sm:py-3.5 sm:px-4 border border-outline-variant/50 dark:border-slate-800 rounded-2xl bg-white/90 dark:bg-slate-900 hover:bg-white dark:hover:bg-slate-850 hover:shadow-sm transition-all cursor-pointer active-feedback text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-100" aria-label="Continue with Google">
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5.04c1.66 0 3.2.57 4.38 1.69l3.27-3.27C17.67 1.58 15.02 1 12 1 7.35 1 3.4 3.65 1.5 7.5l3.86 3C6.27 7.74 8.89 5.04 12 5.04z"/><path fill="#4285F4" d="M23.49 12.27c0-.81-.07-1.59-.2-2.36H12v4.51h6.46c-.29 1.48-1.14 2.73-2.42 3.58l3.76 2.92c2.2-2.03 3.69-5.02 3.69-8.65z"/><path fill="#FBBC05" d="M5.36 14.5c-.24-.72-.38-1.49-.38-2.3s.14-1.58.38-2.3L1.5 6.9C.54 8.82 0 10.97 0 13.2s.54 4.38 1.5 6.3l3.86-3z"/><path fill="#34A853" d="M12 23c3.24 0 5.97-1.07 7.96-2.92l-3.76-2.92c-1.1.74-2.52 1.18-4.2 1.18-3.11 0-5.73-2.7-6.64-5.46L1.5 15.88C3.4 19.73 7.35 23 12 23z"/></svg>
                    Google
                </button>
                <button type="button" onclick="handleSocialAuth('Facebook')" class="social-button flex items-center justify-center gap-1.5 sm:gap-3 py-2.5 px-2 sm:py-3.5 sm:px-4 border border-outline-variant/50 dark:border-slate-800 rounded-2xl bg-white/90 dark:bg-slate-900 hover:bg-white dark:hover:bg-slate-850 hover:shadow-sm transition-all cursor-pointer active-feedback text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-100" aria-label="Continue with Facebook">
                    <svg class="w-5 h-5 shrink-0 fill-current text-[#1877F2]" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                    Facebook
                </button>
            </div>
        </section>
    </div>
    </div>
</div>

<!-- Custom Success Modal -->
<div id="success-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-slate-950/60 p-4 backdrop-blur-sm">
    <div class="w-full max-w-sm rounded-[30px] bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 p-6 text-center shadow-2xl scale-95 transition-all">
        <!-- Success Icon -->
        <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-emerald-50 dark:bg-emerald-950/30 text-emerald-500">
            <span class="material-symbols-outlined text-[36px] font-bold">check_circle</span>
        </div>
        <!-- Heading -->
        <h3 class="text-xl font-black text-slate-800 dark:text-white mb-2">Login Successful</h3>
        <!-- Subtext -->
        <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 mb-6 leading-relaxed">
            Welcome back! You have logged in successfully.
        </p>
        <!-- Action Button -->
        <button id="success-btn" class="w-full bg-primary hover:bg-primary/95 text-white py-3 rounded-2xl font-extrabold text-sm shadow-lg shadow-blue-500/20 hover:-translate-y-0.5 transition-all active:scale-98 cursor-pointer">
            Continue to Dashboard
        </button>
    </div>
</div>

<script>
    let mode = 'signin';

    // Parse redirects
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect') || 'projects.html';

    function showSuccessAndRedirect() {
        let targetUrl = redirectUrl;
        if (targetUrl.includes('profile.html')) {
            targetUrl = 'projects.html';
        }

        const modal = document.getElementById('success-modal');
        const btn = document.getElementById('success-btn');
        if (modal && btn) {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            btn.addEventListener('click', () => {
                window.location.replace(targetUrl);
            });
            
            setTimeout(() => {
                window.location.replace(targetUrl);
            }, 1800);
        } else {
            window.location.replace(targetUrl);
        }
    }

    // Password toggle wire-up
    const passwordToggle = document.getElementById('password-toggle');
    const passwordInput = document.getElementById('auth-password');
    const eyeIcon = document.getElementById('eye-icon');
    if (passwordToggle && passwordInput && eyeIcon) {
        passwordToggle.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerText = 'visibility';
            }
        });
    }

    function toggleMode(targetMode) {
        if (mode === targetMode) return;
        mode = targetMode;

        const submitBtn = document.getElementById('submit-btn');
        const signupFields = document.getElementById('signup-fields');
        const confirmPasswordWrap = document.getElementById('confirm-password-wrap');
        const nameInput = document.getElementById('auth-name');
        const confirmPasswordInput = document.getElementById('auth-confirm-password');
        
        const tabSignin = document.getElementById('tab-signin');
        const tabSignup = document.getElementById('tab-signup');
        const authTabs = document.getElementById('auth-tabs');

        if (mode === 'signin') {
            submitBtn.innerHTML = `Sign In <span class="material-symbols-outlined text-[18px] font-bold">arrow_forward</span>`;
            signupFields.classList.remove('is-open');
            confirmPasswordWrap.classList.remove('is-open');
            nameInput.removeAttribute('required');
            confirmPasswordInput.removeAttribute('required');
            
            authTabs.dataset.mode = 'signin';
            tabSignin.className = "w-full text-center py-2.5 rounded-xl font-bold text-body-sm transition-all text-primary dark:text-white z-10 cursor-pointer active-feedback";
            tabSignup.className = "w-full text-center py-2.5 rounded-xl font-bold text-body-sm transition-all text-secondary dark:text-slate-400 z-10 cursor-pointer active-feedback";
            
            const forgotLink = document.getElementById('forgot-password-link');
            if (forgotLink) forgotLink.classList.remove('hidden');
        } else {
            submitBtn.innerHTML = `Create Account <span class="material-symbols-outlined text-[18px] font-bold">person_add</span>`;
            signupFields.classList.add('is-open');
            confirmPasswordWrap.classList.add('is-open');
            nameInput.setAttribute('required', 'required');
            confirmPasswordInput.setAttribute('required', 'required');
            
            authTabs.dataset.mode = 'signup';
            tabSignup.className = "w-full text-center py-2.5 rounded-xl font-bold text-body-sm transition-all text-primary dark:text-white z-10 cursor-pointer active-feedback";
            tabSignin.className = "w-full text-center py-2.5 rounded-xl font-bold text-body-sm transition-all text-secondary dark:text-slate-400 z-10 cursor-pointer active-feedback";
            
            const forgotLink = document.getElementById('forgot-password-link');
            if (forgotLink) forgotLink.classList.add('hidden');
        }
    }

    async function handleAuthSubmit(e) {
        e.preventDefault();
        if (!isFirebaseConfigured) {
            alert('Firebase configuration is still loading. Please try again in a moment.');
            return;
        }

        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        const confirmPassword = document.getElementById('auth-confirm-password').value;
        const name = document.getElementById('auth-name').value.trim();
        const submitBtn = document.getElementById('submit-btn');
        const originalButton = submitBtn.innerHTML;

        if (mode === 'signup' && password !== confirmPassword) {
            alert('Passwords do not match.');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-70', 'cursor-wait');
        submitBtn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span> Please wait`;

        try {
            let credential;
            if (mode === 'signup') {
                credential = await auth.createUserWithEmailAndPassword(email, password);
                await credential.user.updateProfile({ displayName: name });
            } else {
                credential = await auth.signInWithEmailAndPassword(email, password);
            }

            await saveAuthenticatedUser(credential.user, 'Portfolio User');
            showSuccessAndRedirect();
        } catch (error) {
            console.error('Firebase email authentication error:', error);
            const messages = {
                'auth/email-already-in-use': 'An account already exists with this email. Please sign in instead.',
                'auth/invalid-email': 'Please enter a valid email address.',
                'auth/weak-password': 'Use a password with at least 6 characters.',
                'auth/user-not-found': 'No account was found with this email.',
                'auth/wrong-password': 'The password is incorrect. Please try again.',
                'auth/invalid-credential': 'The email or password is incorrect.',
                'auth/operation-not-allowed': 'Enable Email/Password in Firebase Authentication first.'
            };
            alert(messages[error.code] || error.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-70', 'cursor-wait');
            submitBtn.innerHTML = originalButton;
        }
    }

    // ── FIREBASE AUTHENTICATION CONFIGURATION ──────────────────
    // Replace these placeholder details with your actual Firebase project config credentials.
    let isFirebaseConfigured = false;
    let auth;
    function initializeFirebaseAuth(config) {
        if (!config || !config.apiKey || isFirebaseConfigured) return;
        try {
            if (!firebase.apps.length) firebase.initializeApp(config);
            auth = firebase.auth();
            isFirebaseConfigured = true;
        } catch (error) {
            console.error("Firebase Initialization Failed:", error);
        }
    }

    // firebase-config.js dispatches this event once the project configuration is ready.
    initializeFirebaseAuth(window.firebaseConfig);
    window.addEventListener('firebase-config-ready', () => {
        initializeFirebaseAuth(window.firebaseConfig);
        handlePendingRedirectResult();
    }, { once: true });

    async function saveAuthenticatedUser(user, providerName) {
        let profile = null;
        if (window.PortfolioAuth) {
            try {
                profile = await window.PortfolioAuth.ensureUserProfile(user);
            } catch (profileError) {
                console.warn('Profile sync skipped after authentication:', profileError);
            }
        }
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('userName', (profile && profile.displayName) || user.displayName || `${providerName} User`);
        localStorage.setItem('userEmail', user.email || '');
        const avatar = window.PortfolioAuth ? window.PortfolioAuth.getAvatar(profile, user) : user.photoURL;
        if (avatar) localStorage.setItem('userPicture', avatar);
        else localStorage.removeItem('userPicture');
    }

    function getSocialProvider(providerName) {
        if (providerName === 'Google') {
            return new firebase.auth.GoogleAuthProvider();
        }
        if (providerName === 'Facebook') {
            return new firebase.auth.FacebookAuthProvider();
        }
        throw new Error('Unsupported sign-in provider.');
    }

    function showSocialAuthError(providerName, error) {
        console.error(`Firebase ${providerName} Sign-In Error:`, error);
        if (error.code === 'auth/popup-closed-by-user') return;
        alert(`${providerName} login failed: ${error.message}`);
    }

    async function finishSocialAuth(result, providerName) {
        if (!result || !result.user) return;

        await saveAuthenticatedUser(result.user, providerName);
        showSuccessAndRedirect();
    }

    function handleSocialAuth(providerName) {
        if (!isFirebaseConfigured) {
            alert('Real social login ke liye Firebase configuration add karein aur Firebase Console mein provider enable karein.');
            return;
        }

        const provider = getSocialProvider(providerName);
        // OAuth redirects are substantially more reliable in mobile browsers.
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        if (isMobile) {
            auth.signInWithRedirect(provider).catch((error) => showSocialAuthError(providerName, error));
            return;
        }

        auth.signInWithPopup(provider)
            .then((result) => finishSocialAuth(result, providerName))
            .catch((error) => showSocialAuthError(providerName, error));
    }

    // Finish a mobile redirect sign-in after the identity provider returns here.
    function handlePendingRedirectResult() {
        if (!isFirebaseConfigured || !auth) return;
        auth.getRedirectResult()
            .then((result) => {
                if (!result || !result.user) return;
                const providerName = result.credential && result.credential.providerId === 'facebook.com'
                        ? 'Facebook'
                        : 'Google';
                return finishSocialAuth(result, providerName);
            })
            .catch((error) => showSocialAuthError('Social', error));
    }
    handlePendingRedirectResult();

    function handleForgotPassword(e) {
        e.preventDefault();
        const emailInput = document.getElementById('auth-email').value;
        if (!emailInput) {
            alert("Please enter your email address first so we can send you a password reset link!");
            return;
        }

        if (!isFirebaseConfigured) {
            alert('Firebase configuration is still loading. Please try again in a moment.');
            return;
        }

        auth.sendPasswordResetEmail(emailInput)
            .then(() => alert(`A password reset link has been sent to: ${emailInput}`))
            .catch((error) => {
                console.error('Firebase password reset error:', error);
                alert(error.code === 'auth/user-not-found' ? 'No account was found with this email.' : error.message);
            });
    }
</script>
</body>
</html>
