<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You — Algora Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&family=Outfit:wght@800;900&family=Syne:wght@800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: #ffffff;
            margin: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', 'Outfit', sans-serif;
        }

        /* ═══════════════════════════════════════════════════════════
           ULTRA-FLUID PER-LETTER KINETIC LIQUID WAVE CHOREOGRAPHY
           ═══════════════════════════════════════════════════════════ */
        
        .fluid-word-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.04em;
            transform: translateZ(0);
            backface-visibility: hidden;
            perspective: 1000px;
        }

        .fluid-letter {
            display: inline-block;
            font-size: clamp(3rem, 9.5vw, 6.5rem);
            font-weight: 900;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 55%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: translateY(80px) scale(0.35) rotate(-16deg) skewY(10deg);
            filter: blur(14px);
            will-change: transform, opacity, filter;
            animation: fluidLetterEmerge 1.0s cubic-bezier(0.34, 1.45, 0.64, 1) forwards,
                       fluidLetterFloat 2.6s ease-in-out 1.2s infinite alternate;
        }

        .fluid-space {
            width: clamp(0.6rem, 2.5vw, 1.8rem);
        }

        .fluid-dot {
            display: inline-block;
            font-size: clamp(3rem, 9.5vw, 6.5rem);
            font-weight: 900;
            color: #eb0028;
            background: linear-gradient(135deg, #f43f5e 0%, #eb0028 60%, #9f1239 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: translateY(90px) scale(0);
            filter: blur(10px);
            will-change: transform, opacity;
            animation: fluidDotPop 0.85s cubic-bezier(0.34, 1.6, 0.64, 1) 0.82s forwards,
                       fluidDotFloat 2.6s ease-in-out 1.5s infinite alternate;
        }

        /* ── Staggered Wave Delays ── */
        .l-1  { animation-delay: 0.08s, 1.1s; }
        .l-2  { animation-delay: 0.16s, 1.2s; }
        .l-3  { animation-delay: 0.24s, 1.3s; }
        .l-4  { animation-delay: 0.32s, 1.4s; }
        .l-5  { animation-delay: 0.40s, 1.5s; }
        
        .l-6  { animation-delay: 0.52s, 1.6s; }
        .l-7  { animation-delay: 0.60s, 1.7s; }
        .l-8  { animation-delay: 0.68s, 1.8s; }

        /* Stage 1: Liquid Letter Emerge */
        @keyframes fluidLetterEmerge {
            0% {
                opacity: 0;
                transform: translateY(80px) scale(0.35) rotate(-16deg) skewY(10deg);
                filter: blur(14px);
            }
            55% {
                opacity: 1;
                filter: blur(0px);
                transform: translateY(-16px) scale(1.18) rotate(4deg) skewY(-3deg);
            }
            80% {
                transform: translateY(5px) scale(0.96) rotate(-1deg) skewY(1deg);
            }
            100% {
                opacity: 1;
                filter: blur(0px);
                transform: translateY(0px) scale(1) rotate(0deg) skewY(0deg);
            }
        }

        /* Stage 2: Liquid Dot Pop */
        @keyframes fluidDotPop {
            0% {
                opacity: 0;
                transform: translateY(90px) scale(0);
                filter: blur(10px);
            }
            60% {
                opacity: 1;
                filter: blur(0px);
                transform: translateY(-22px) scale(1.45);
            }
            85% {
                transform: translateY(4px) scale(0.92);
            }
            100% {
                opacity: 1;
                filter: blur(0px);
                transform: translateY(0) scale(1);
            }
        }

        /* Continuous Organic Floating Wave */
        @keyframes fluidLetterFloat {
            0% {
                transform: translateY(0px) rotate(0deg);
            }
            100% {
                transform: translateY(-8px) rotate(1.8deg);
            }
        }

        @keyframes fluidDotFloat {
            0% {
                transform: translateY(0px) scale(1);
            }
            100% {
                transform: translateY(-12px) scale(1.15);
            }
        }

        /* Ambient Ethereal Pulse Aura */
        .ambient-aura {
            position: absolute;
            width: 520px;
            height: 280px;
            background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.09) 0%, rgba(235, 0, 40, 0.05) 45%, transparent 70%);
            filter: blur(45px);
            pointer-events: none;
            z-index: 0;
            animation: pulseAura 3s ease-in-out infinite alternate;
        }

        @keyframes pulseAura {
            0% { transform: scale(0.85); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 1; }
        }
    </style>
</head>
<body class="bg-white">

    <!-- AMBIENT AURA -->
    <div class="ambient-aura"></div>

    <!-- FLUID PER-LETTER WORD -->
    <div class="relative z-10 fluid-word-container">
        <span class="fluid-letter l-1">T</span>
        <span class="fluid-letter l-2">h</span>
        <span class="fluid-letter l-3">a</span>
        <span class="fluid-letter l-4">n</span>
        <span class="fluid-letter l-5">k</span>
        <div class="fluid-space"></div>
        <span class="fluid-letter l-6">Y</span>
        <span class="fluid-letter l-7">o</span>
        <span class="fluid-letter l-8">u</span>
        <span class="fluid-dot">.</span>
    </div>

    <!-- SCRIPT: AUTO-REDIRECT TO TICKET AFTER FLUID ANIMATION (2.2s assemble + 1.4s solid wave hold) -->
    <script>
        setTimeout(() => {
            window.location.replace('thank-you.html');
        }, 3600);
    </script>
</body>
</html>
