<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You! — Preparing Your Pass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: geometricPrecision;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #ffffff;
            margin: 0;
            overflow: hidden;
        }

        /* ═══════════════════════════════════════════════════════════
           SNAPPY FLUID EASE-OUT 120FPS GPU VECTOR ANIMATION
           ═══════════════════════════════════════════════════════════ */
        .loader {
            display: flex;
            margin: 0.25em 0;
            align-items: center;
            justify-content: center;
            transform: translateZ(0);
            backface-visibility: hidden;
            perspective: 1000px;
        }

        .loader .w-2 {
            width: 0.45em;
        }

        .dash {
            stroke-dasharray: 0 1 359 0;
            stroke-dashoffset: 365;
            will-change: stroke-dasharray, stroke-dashoffset;
            animation: dashArraySmooth 2.6s ease-out forwards,
                dashOffsetSmooth 2.6s ease-out forwards;
            shape-rendering: geometricPrecision;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .spin {
            stroke-dasharray: 270 90;
            stroke-dashoffset: 365;
            will-change: stroke-dasharray, stroke-dashoffset, transform;
            animation: spinDashArraySmooth 2.6s ease-out forwards,
                spinSmooth 2.6s ease-out forwards,
                dashOffsetSmooth 2.6s ease-out forwards;
            transform-origin: center;
            shape-rendering: geometricPrecision;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes dashArraySmooth {
            0% {
                stroke-dasharray: 0 1 359 0;
            }
            40% {
                stroke-dasharray: 0 359 1 0;
            }
            80%, 100% {
                stroke-dasharray: 359 1 0 0;
            }
        }

        @keyframes spinDashArraySmooth {
            0% {
                stroke-dasharray: 270 90;
            }
            40% {
                stroke-dasharray: 0 360;
            }
            80%, 100% {
                stroke-dasharray: 359 1;
            }
        }

        @keyframes dashOffsetSmooth {
            0% {
                stroke-dashoffset: 365;
            }
            80%, 100% {
                stroke-dashoffset: 0;
            }
        }

        @keyframes spinSmooth {
            0% {
                rotate: 0deg;
            }
            45% {
                rotate: 180deg;
            }
            80%, 100% {
                rotate: 360deg;
            }
        }
        /* Smooth exit transition to boarding pass ticket */
        .exit-transition {
            animation: smoothStageExit 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes smoothStageExit {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0px);
            }
            100% {
                opacity: 0;
                transform: translateY(-30px) scale(0.92);
                filter: blur(8px);
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 select-none bg-white">

    <!-- FULL SCREEN PURE ANIMATION CONTAINER (ORIGINAL SIZE) -->
    <div id="animationStage" class="flex flex-col items-center justify-center w-full h-full my-auto text-center transition-all duration-500">
        
        <!-- SelfMadeSystem Gradients Definition -->
        <svg height="0" width="0" viewBox="0 0 64 64" class="absolute pointer-events-none" shape-rendering="geometricPrecision">
          <defs class="s-xJBuHA073rTt" xmlns="http://www.w3.org/2000/svg">
            <linearGradient class="s-xJBuHA073rTt" gradientUnits="userSpaceOnUse" y2="2" x2="0" y1="62" x1="0" id="sms-b">
              <stop class="s-xJBuHA073rTt" stop-color="#973BED"></stop>
              <stop class="s-xJBuHA073rTt" stop-color="#007CFF" offset="1"></stop>
            </linearGradient>
            <linearGradient class="s-xJBuHA073rTt" gradientUnits="userSpaceOnUse" y2="0" x2="0" y1="64" x1="0" id="sms-c">
              <stop class="s-xJBuHA073rTt" stop-color="#FFC800"></stop>
              <stop class="s-xJBuHA073rTt" stop-color="#F0F" offset="1"></stop>
              <animateTransform repeatCount="indefinite" keySplines=".42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1" keyTimes="0; 0.125; 0.25; 0.375; 0.5; 0.625; 0.75; 0.875; 1" dur="8s" values="0 32 32;-270 32 32;-270 32 32;-540 32 32;-540 32 32;-810 32 32;-810 32 32;-1080 32 32;-1080 32 32" type="rotate" attributeName="gradientTransform"></animateTransform>
            </linearGradient>
            <linearGradient class="s-xJBuHA073rTt" gradientUnits="userSpaceOnUse" y2="2" x2="0" y1="62" x1="0" id="sms-d">
              <stop class="s-xJBuHA073rTt" stop-color="#00E0ED"></stop>
              <stop class="s-xJBuHA073rTt" stop-color="#00DA72" offset="1"></stop>
            </linearGradient>
          </defs>
        </svg>

        <!-- DUAL ROW ORIGINAL SCALE VECTOR GLYPHS (INITIAL HIDDEN STATE ZERO FLASH) -->
        <div class="flex flex-col items-center justify-center gap-1 sm:gap-2 my-auto">
          
          <!-- ROW 1: T - H - A - N - K -->
          <div class="loader flex items-center justify-center">
            <!-- T -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 64 64" height="48" width="48" class="inline-block" shape-rendering="geometricPrecision">
              <path stroke-linejoin="round" stroke-linecap="round" stroke-width="8" stroke="url(#sms-b)" d="M 8,10 H 56 V 16 H 36 V 54 H 28 V 16 H 8 Z" class="dash" style="stroke-dasharray: 0 1 359 0; stroke-dashoffset: 365;" pathLength="360"></path>
            </svg>
            <!-- H -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 64 64" height="48" width="48" class="inline-block" shape-rendering="geometricPrecision">
              <path stroke-linejoin="round" stroke-linecap="round" stroke-width="8" stroke="url(#sms-c)" d="M 10,10 H 18 V 28 H 46 V 10 H 54 V 54 H 46 V 36 H 18 V 54 H 10 Z" class="dash" style="stroke-dasharray: 0 1 359 0; stroke-dashoffset: 365;" pathLength="360"></path>
            </svg>
            <!-- A -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 64 64" height="48" width="48" class="inline-block" shape-rendering="geometricPrecision">
              <path stroke-linejoin="round" stroke-linecap="round" stroke-width="8" stroke="url(#sms-d)" d="M 32,8 L 56,54 H 46 L 39,40 H 25 L 18,54 H 8 Z M 32,22 L 27,33 H 37 Z" class="dash" style="stroke-dasharray: 0 1 359 0; stroke-dashoffset: 365;" pathLength="360"></path>
            </svg>
            <!-- N -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 64 64" height="48" width="48" class="inline-block" shape-rendering="geometricPrecision">
              <path stroke-linejoin="round" stroke-linecap="round" stroke-width="8" stroke="url(#sms-b)" d="M 10,10 H 18 L 46,46 V 10 H 54 V 54 H 46 L 18,18 V 54 H 10 Z" class="dash" style="stroke-dasharray: 0 1 359 0; stroke-dashoffset: 365;" pathLength="360"></path>
            </svg>
            <!-- K -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 64 64" height="48" width="48" class="inline-block" shape-rendering="geometricPrecision">
              <path stroke-linejoin="round" stroke-linecap="round" stroke-width="8" stroke="url(#sms-c)" d="M 12,10 H 20 V 28 L 44,10 H 54 L 28,31 L 54,54 H 44 L 20,34 V 54 H 12 Z" class="dash" style="stroke-dasharray: 0 1 359 0; stroke-dashoffset: 365;" pathLength="360"></path>
            </svg>
          </div>

          <!-- ROW 2: Y - O - U -->
          <div class="loader flex items-center justify-center scale-105">
            <!-- Y -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 64 64" height="50" width="50" class="inline-block" shape-rendering="geometricPrecision">
              <path stroke-linejoin="round" stroke-linecap="round" stroke-width="8" stroke="url(#sms-b)" d="M 54.722656,3.9726563 A 2.0002,2.0002 0 0 0 54.941406,4 h 5.007813 C 58.955121,17.046124 49.099667,27.677057 36.121094,29.580078 a 2.0002,2.0002 0 0 0 -1.708985,1.978516 V 60 H 29.587891 V 31.558594 A 2.0002,2.0002 0 0 0 27.878906,29.580078 C 14.900333,27.677057 5.0448787,17.046124 4.0507812,4 H 9.28125 c 1.231666,11.63657 10.984383,20.554048 22.6875,20.734375 a 2.0002,2.0002 0 0 0 0.02344,0 c 11.806958,0.04283 21.70649,-9.003371 22.730469,-20.7617187 z" class="dash" id="y" style="stroke-dasharray: 0 1 359 0; stroke-dashoffset: 365;" pathLength="360"></path>
            </svg>
            <!-- O -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" style="--rotation-duration:0ms; --rotation-direction:normal;" viewBox="0 0 64 64" height="50" width="50" class="inline-block" shape-rendering="geometricPrecision">
              <path stroke-linejoin="round" stroke-linecap="round" stroke-width="10" stroke="url(#sms-c)" d="M 32 32 m 0 -27 a 27 27 0 1 1 0 54 a 27 27 0 1 1 0 -54" class="spin" id="o" style="stroke-dasharray: 270 90; stroke-dashoffset: 365;" pathLength="360"></path>
            </svg>
            <div class="w-2"></div>
            <!-- U -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" style="--rotation-duration:0ms; --rotation-direction:normal;" viewBox="0 0 64 64" height="50" width="50" class="inline-block" shape-rendering="geometricPrecision">
              <path stroke-linejoin="round" stroke-linecap="round" stroke-width="8" stroke="url(#sms-d)" d="M 4,4 h 4.6230469 v 25.919922 c -0.00276,11.916203 9.8364941,21.550422 21.7500001,21.296875 11.616666,-0.240651 21.014356,-9.63894 21.253906,-21.25586 a 2.0002,2.0002 0 0 0 0,-0.04102 V 4 H 56.25 v 25.919922 c 0,14.33873 -11.581192,25.919922 -25.919922,25.919922 a 2.0002,2.0002 0 0 0 -0.0293,0 C 15.812309,56.052941 3.998433,44.409961 4,29.919922 Z" class="dash" id="u" style="stroke-dasharray: 0 1 359 0; stroke-dashoffset: 365;" pathLength="360"></path>
            </svg>
          </div>

        </div>
    </div>

    <!-- SCRIPT: SMOOTH EXIT AND AUTO-REDIRECT TO TICKET -->
    <script>
        // Start smooth exit transition at 3.3s, redirect at 3.8s
        setTimeout(() => {
            const stage = document.getElementById('animationStage');
            if (stage) stage.classList.add('exit-transition');
        }, 3300);

        setTimeout(() => {
            window.location.replace('thank-you.html');
        }, 3800);
    </script>
</body>
</html>
