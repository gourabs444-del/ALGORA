<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You! — Algora Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #ffffff;
            margin: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body class="bg-white">

    <canvas id="particleCanvas"></canvas>

    <script>
    (function() {
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        let width = 0;
        let height = 0;
        let dpr = Math.min(window.devicePixelRatio || 1, 2);
        let particles = [];
        let startTime = null;
        const DURATION = 2400; // 2.4s convergence
        const HOLD_TIME = 1500; // 1.5s hold
        const TOTAL_TIME = DURATION + HOLD_TIME; // 3.9s total before redirect

        const PALETTE = [
            '#973BED', '#007CFF', '#00E0ED', '#00DA72', '#FFC800', '#FF2E93', '#7C3AED'
        ];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            initParticles();
        }

        function createOffscreenTargetMap() {
            const offCanvas = document.createElement('canvas');
            const offCtx = offCanvas.getContext('2d');
            offCanvas.width = width;
            offCanvas.height = height;

            offCtx.fillStyle = '#000000';
            offCtx.fillRect(0, 0, width, height);

            // Responsive font scaling
            const baseFontSize = Math.max(Math.min(width * 0.11, 100), 44);
            offCtx.font = `900 ${baseFontSize}px 'Outfit', 'Plus Jakarta Sans', sans-serif`;
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillStyle = '#FFFFFF';

            const centerY = height / 2;
            const lineGap = baseFontSize * 0.58;

            offCtx.fillText('THANK', width / 2, centerY - lineGap);
            offCtx.fillText('YOU', width / 2, centerY + lineGap);

            const imgData = offCtx.getImageData(0, 0, width, height).data;
            const targetPoints = [];
            const step = Math.max(Math.floor(baseFontSize / 12), 4); // Sampling density

            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const idx = (y * width + x) * 4;
                    if (imgData[idx] > 140) { // White pixel
                        targetPoints.push({ x: x, y: y });
                    }
                }
            }
            return targetPoints;
        }

        function initParticles() {
            const targets = createOffscreenTargetMap();
            particles = [];

            const corners = [
                { x: -50, y: -50 },                     // Top-Left
                { x: width + 50, y: -50 },              // Top-Right
                { x: -50, y: height + 50 },             // Bottom-Left
                { x: width + 50, y: height + 50 },      // Bottom-Right
                { x: width / 2, y: -80 },               // Top-Center
                { x: width / 2, y: height + 80 },       // Bottom-Center
                { x: -80, y: height / 2 },              // Left-Center
                { x: width + 80, y: height / 2 }        // Right-Center
            ];

            for (let i = 0; i < targets.length; i++) {
                const target = targets[i];
                // Assign to a random outer corner
                const corner = corners[Math.floor(Math.random() * corners.length)];
                
                // Add random jitter to corner starting point
                const startX = corner.x + (Math.random() - 0.5) * 160;
                const startY = corner.y + (Math.random() - 0.5) * 160;

                // Control point for smooth curved trajectories
                const ctrlX = (startX + target.x) / 2 + (Math.random() - 0.5) * (width * 0.45);
                const ctrlY = (startY + target.y) / 2 + (Math.random() - 0.5) * (height * 0.45);

                const color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
                const radius = (Math.random() * 1.8 + 2.2);

                particles.push({
                    sx: startX,
                    sy: startY,
                    cx: ctrlX,
                    cy: ctrlY,
                    tx: target.x,
                    ty: target.y,
                    x: startX,
                    y: startY,
                    color: color,
                    radius: radius,
                    delay: Math.random() * 0.22 // Slight wave staggered launch
                });
            }
        }

        // Cubic ease-out curve
        function easeOutCubic(t) {
            return (--t) * t * t + 1;
        }

        // Quadratic Bezier interpolation
        function getBezierPoint(t, p0, p1, p2) {
            const oneMinusT = 1 - t;
            return oneMinusT * oneMinusT * p0 + 2 * oneMinusT * t * p1 + t * t * p2;
        }

        function render(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;

            ctx.clearRect(0, 0, width, height);

            let allReached = true;

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                
                // Normalized progress with individual delay
                let localProgress = Math.max(0, (elapsed - p.delay * DURATION) / (DURATION * (1 - p.delay)));
                localProgress = Math.min(localProgress, 1);

                const easedT = easeOutCubic(localProgress);

                if (localProgress < 1) {
                    allReached = false;
                    p.x = getBezierPoint(easedT, p.sx, p.cx, p.tx);
                    p.y = getBezierPoint(easedT, p.sy, p.cy, p.ty);
                } else {
                    // Locked at target with subtle micro-breathe
                    p.x = p.tx;
                    p.y = p.ty;
                }

                // Draw glowing particle dot
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = localProgress >= 0.9 ? 6 : 10;
                ctx.fill();
            }

            ctx.shadowBlur = 0; // reset

            if (elapsed < TOTAL_TIME) {
                requestAnimationFrame(render);
            } else {
                // Navigate to thank-you ticket card
                window.location.replace('thank-you.html');
            }
        }

        // Ensure fonts are loaded before calculating target text metrics
        document.fonts.ready.then(() => {
            resize();
            window.addEventListener('resize', resize);
            requestAnimationFrame(render);
        });

    })();
    </script>
</body>
</html>
