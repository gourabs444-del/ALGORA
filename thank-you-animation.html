<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thank you — Algora Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: geometricPrecision;
        }

        body {
            background-color: #ffffff;
            margin: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ═══════════════════════════════════════════════════════════
           APPLE iPHONE 'HELLO' SIGNATURE CURSIVE WRITE ANIMATION
           ═══════════════════════════════════════════════════════════ */
        .apple-canvas {
            transform: translateZ(0);
            backface-visibility: hidden;
            perspective: 1000px;
        }

        .apple-write-path {
            stroke-dasharray: 2200;
            stroke-dashoffset: 2200;
            will-change: stroke-dashoffset;
            animation: appleHandwrite 2.5s cubic-bezier(0.45, 0, 0.25, 1) forwards;
            shape-rendering: geometricPrecision;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .apple-crossbar {
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            will-change: stroke-dashoffset;
            animation: appleCrossbar 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) 1.6s forwards;
            shape-rendering: geometricPrecision;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes appleHandwrite {
            0% {
                stroke-dashoffset: 2200;
            }
            100% {
                stroke-dashoffset: 0;
            }
        }

        @keyframes appleCrossbar {
            0% {
                stroke-dashoffset: 200;
            }
            100% {
                stroke-dashoffset: 0;
            }
        }
    </style>
</head>
<body class="bg-white">

    <!-- APPLE 'HELLO' STYLE SIGNATURE DISPLAY CONTAINER -->
    <div class="flex flex-col items-center justify-center w-full h-full my-auto text-center apple-canvas max-w-2xl px-6">
        
        <svg viewBox="0 0 740 260" class="w-full h-auto max-w-xl mx-auto overflow-visible select-none pointer-events-none" shape-rendering="geometricPrecision">
          <defs>
            <!-- Apple Spectrum Gradient (Deep Indigo to Electric Cyan to Vibrant Coral) -->
            <linearGradient id="apple-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#1d1d1f" />
              <stop offset="35%" stop-color="#4338ca" />
              <stop offset="70%" stop-color="#0284c7" />
              <stop offset="100%" stop-color="#2563eb" />
            </linearGradient>

            <linearGradient id="apple-vibrant" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#973BED" />
              <stop offset="50%" stop-color="#007CFF" />
              <stop offset="100%" stop-color="#00DA72" />
            </linearGradient>
          </defs>

          <!-- ══════════════════════════════════════════════════════════════
               ICONIC FLOWING CURSIVE CALLIGRAPHY: "thank you"
               ══════════════════════════════════════════════════════════════ -->
          <!-- Continuous main cursive stroke: t-h-a-n-k  y-o-u -->
          <path d="
            M 65,130 C 70,85 82,30 88,20 C 90,16 93,22 91,48 L 82,142 C 80,160 92,165 102,158 C 114,148 118,105 125,58 C 128,38 132,32 135,36 C 137,42 133,78 126,128 L 123,162 C 122,170 128,172 134,166 C 146,152 152,118 158,110 C 166,100 178,102 176,122 L 172,162 C 171,170 176,172 184,165 C 196,152 205,130 216,114 C 210,114 198,126 195,142 C 192,160 204,168 216,162 C 226,156 232,138 234,112 L 235,162 C 235,170 242,170 250,162 C 262,150 268,120 274,110 C 282,98 294,102 291,122 L 287,162 C 286,170 294,170 302,162 C 314,148 322,118 328,110 C 336,98 348,102 345,122 L 341,162 C 340,170 348,172 355,165 C 368,150 376,102 384,52 C 388,28 392,26 395,32 C 397,38 390,82 382,132 L 378,162 C 377,170 384,170 392,162 C 404,148 418,128 424,115 C 418,128 406,140 412,154 C 416,164 428,166 438,158 C 452,146 462,132 472,122
            M 495,116 C 504,110 514,122 510,142 C 504,172 494,228 488,245 C 484,256 476,258 472,250 C 466,238 480,198 496,162 C 508,138 522,114 538,110 C 548,108 556,120 552,142 L 548,162 C 547,170 555,170 562,162 C 576,146 585,124 595,112 C 588,112 576,126 572,142 C 568,160 580,168 592,162 C 604,154 612,134 614,112 M 614,112 C 614,112 612,148 610,162 C 609,170 618,172 626,164 C 638,150 648,122 654,112 C 662,100 674,104 671,124 L 666,162 C 665,170 674,170 684,158 C 696,144 706,132 715,124
          " class="apple-write-path" fill="none" stroke="url(#apple-vibrant)" stroke-width="7" />

          <!-- High-precision 't' crossbar stroke that swiftly crosses the t -->
          <path d="M 52,96 Q 88,92 118,88" class="apple-crossbar" fill="none" stroke="url(#apple-vibrant)" stroke-width="6.5" />
        </svg>

    </div>

    <!-- SCRIPT: AUTO-REDIRECT TO TICKET AFTER APPLE ANIMATION COMPLETES (2.5s draw + 1.5s solid hold) -->
    <script>
        setTimeout(() => {
            window.location.replace('thank-you.html');
        }, 4000);
    </script>
</body>
</html>
