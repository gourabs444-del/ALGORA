<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You — Algora Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: #ffffff;
            margin: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', 'Outfit', sans-serif;
        }

        /* ═══════════════════════════════════════════════════════════
           ONEPLUS OXYGENOS FIRST BOOT KINETIC ANIMATION
           ═══════════════════════════════════════════════════════════ */
        
        /* 1. INITIAL ORBITING RED DOTS (Stage 1: 0.0s - 1.2s) */
        .op-orbit-container {
            position: absolute;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: opOrbitCollapse 1.2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        .op-center-dot {
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: #eb0028; /* Signature OnePlus Red */
            border-radius: 50%;
            animation: opPulseCenter 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            box-shadow: 0 0 20px rgba(235, 0, 40, 0.45);
        }

        .op-orbit-dot {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #0f172a;
            border-radius: 50%;
            animation: opSpinDot 1.2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        .op-orbit-dot-1 {
            top: 0;
            left: 25px;
        }

        .op-orbit-dot-2 {
            bottom: 0;
            left: 25px;
        }

        @keyframes opSpinDot {
            0% {
                transform: rotate(0deg) translateY(-22px) scale(0);
                opacity: 0;
            }
            30% {
                transform: rotate(180deg) translateY(-22px) scale(1);
                opacity: 1;
            }
            75% {
                transform: rotate(540deg) translateY(-24px) scale(1);
                opacity: 1;
            }
            100% {
                transform: rotate(720deg) translateY(0) scale(0);
                opacity: 0;
            }
        }

        @keyframes opPulseCenter {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            30% {
                transform: scale(1.3);
                opacity: 1;
            }
            80% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(4.5);
                opacity: 0;
            }
        }

        @keyframes opOrbitCollapse {
            0%, 80% {
                opacity: 1;
                pointer-events: auto;
            }
            100% {
                opacity: 0;
                pointer-events: none;
            }
        }

        /* 2. TEXT REVEAL: "Thank You." (Stage 2: 1.1s - 2.5s) */
        .op-text-container {
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.92);
            animation: opRevealContainer 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.05s forwards;
        }

        .op-char {
            display: inline-block;
            font-size: clamp(2.6rem, 7.5vw, 5.5rem);
            font-weight: 900;
            color: #0f172a;
            letter-spacing: -0.03em;
            opacity: 0;
            transform: translateY(35px) scale(0.75);
            filter: blur(8px);
            animation: opCharPop 0.7s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
        }

        /* Letter Delays */
        .c-1  { animation-delay: 1.10s; }
        .c-2  { animation-delay: 1.15s; }
        .c-3  { animation-delay: 1.20s; }
        .c-4  { animation-delay: 1.25s; }
        .c-5  { animation-delay: 1.30s; }
        .c-space { width: 0.32em; }
        .c-6  { animation-delay: 1.38s; }
        .c-7  { animation-delay: 1.43s; }
        .c-8  { animation-delay: 1.48s; }

        /* Signature OnePlus Red Dot Period */
        .op-red-period {
            display: inline-block;
            color: #eb0028;
            font-size: clamp(2.6rem, 7.5vw, 5.5rem);
            font-weight: 900;
            opacity: 0;
            transform: translateY(40px) scale(0);
            animation: opDotBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 1.55s forwards;
            text-shadow: 0 4px 18px rgba(235, 0, 40, 0.35);
        }

        @keyframes opCharPop {
            0% {
                opacity: 0;
                transform: translateY(35px) scale(0.75);
                filter: blur(8px);
            }
            60% {
                opacity: 1;
                filter: blur(0px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0px);
            }
        }

        @keyframes opDotBounce {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0);
            }
            60% {
                opacity: 1;
                transform: translateY(-8px) scale(1.35);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes opRevealContainer {
            0% {
                opacity: 0;
                transform: scale(0.92);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body class="bg-white">

    <!-- STAGE 1: ONEPLUS RED DOT ORBIT & PULSE -->
    <div class="op-orbit-container">
        <div class="op-orbit-dot op-orbit-dot-1"></div>
        <div class="op-center-dot"></div>
        <div class="op-orbit-dot op-orbit-dot-2"></div>
    </div>

    <!-- STAGE 2: KINETIC "Thank You." REVEAL -->
    <div class="op-text-container">
        <span class="op-char c-1">T</span>
        <span class="op-char c-2">h</span>
        <span class="op-char c-3">a</span>
        <span class="op-char c-4">n</span>
        <span class="op-char c-5">k</span>
        <span class="c-space"></span>
        <span class="op-char c-6">Y</span>
        <span class="op-char c-7">o</span>
        <span class="op-char c-8">u</span>
        <span class="op-red-period">.</span>
    </div>

    <!-- SCRIPT: AUTO-REDIRECT TO TICKET AFTER ANIMATION COMPLETES (2.0s reveal + 1.5s solid hold) -->
    <script>
        setTimeout(() => {
            window.location.replace('thank-you.html');
        }, 3600);
    </script>
</body>
</html>
