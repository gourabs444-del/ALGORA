<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You! — Algora Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,700;0,6..96,800;0,6..96,900;1,6..96,700;1,800&family=Cinzel:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: geometricPrecision;
        }

        body {
            font-family: 'Cinzel', 'Bodoni Moda', serif;
            background: #ffffff;
            margin: 0;
            overflow: hidden;
        }

        /* ═══════════════════════════════════════════════════════════
           HIGH-FASHION LUXURY EDITORIAL GRADIENT VECTOR ANIMATION
           ═══════════════════════════════════════════════════════════ */
        .fashion-svg-container {
            transform: translateZ(0);
            backface-visibility: hidden;
            perspective: 1000px;
        }

        .fashion-text-thank {
            font-family: 'Cinzel', 'Bodoni Moda', serif;
            font-size: 78px;
            font-weight: 800;
            letter-spacing: 0.28em;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawFashionStroke 2.6s ease-out forwards;
            shape-rendering: geometricPrecision;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .fashion-text-you {
            font-family: 'Cinzel', 'Bodoni Moda', serif;
            font-size: 82px;
            font-weight: 800;
            letter-spacing: 0.34em;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawFashionStroke 2.6s ease-out forwards;
            shape-rendering: geometricPrecision;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes drawFashionStroke {
            0% {
                stroke-dashoffset: 1000;
                fill-opacity: 0;
            }
            70% {
                stroke-dashoffset: 0;
                fill-opacity: 0;
            }
            100% {
                stroke-dashoffset: 0;
                fill-opacity: 0.12;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 select-none bg-white">

    <!-- FULL SCREEN HIGH-FASHION LUXURY ANIMATION CONTAINER -->
    <div class="flex flex-col items-center justify-center w-full h-full my-auto text-center fashion-svg-container max-w-2xl mx-auto px-4">
        
        <svg viewBox="0 0 600 230" class="w-full h-auto overflow-visible" shape-rendering="geometricPrecision">
          <defs>
            <!-- Luxury Multi-color Gradients -->
            <linearGradient id="sms-b" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#973BED" />
              <stop offset="100%" stop-color="#007CFF" />
            </linearGradient>

            <linearGradient id="sms-c" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FF9900" />
              <stop offset="50%" stop-color="#FF2E93" />
              <stop offset="100%" stop-color="#973BED" />
            </linearGradient>

            <linearGradient id="sms-d" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#00E0ED" />
              <stop offset="100%" stop-color="#00DA72" />
            </linearGradient>

            <!-- Luxury Fill Gradient -->
            <linearGradient id="fashion-fill" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#973BED" stop-opacity="0.25" />
              <stop offset="50%" stop-color="#007CFF" stop-opacity="0.20" />
              <stop offset="100%" stop-color="#00DA72" stop-opacity="0.25" />
            </linearGradient>
          </defs>

          <!-- ROW 1: T H A N K (High-Fashion Editorial Serif) -->
          <text x="315" y="85" text-anchor="middle" class="fashion-text-thank" fill="url(#fashion-fill)" stroke="url(#sms-b)" stroke-width="2.8" pathLength="1000">THANK</text>

          <!-- ROW 2: Y O U (High-Fashion Editorial Serif) -->
          <text x="320" y="190" text-anchor="middle" class="fashion-text-you" fill="url(#fashion-fill)" stroke="url(#sms-c)" stroke-width="2.8" pathLength="1000">YOU</text>
        </svg>

    </div>

    <!-- SCRIPT: AUTO-REDIRECT TO TICKET AFTER ANIMATION COMPLETES (2.6s ease-out draw + 1.4s solid hold) -->
    <script>
        setTimeout(() => {
            window.location.replace('thank-you.html');
        }, 4000);
    </script>
</body>
</html>
