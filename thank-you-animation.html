<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You — Algora Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&family=Syne:wght@700;800;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: geometricPrecision;
        }

        body {
            background-color: #ffffff;
            margin: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syne', 'Outfit', sans-serif;
        }

        /* ═══════════════════════════════════════════════════════════
           AWARD-WINNING HOLOGRAPHIC KINETIC STROKE & FILL BLOOM
           ═══════════════════════════════════════════════════════════ */
        .stage-container {
            transform: translateZ(0);
            backface-visibility: hidden;
            perspective: 1000px;
        }

        .kinetic-stroke-1 {
            font-family: 'Syne', sans-serif;
            font-size: 88px;
            font-weight: 900;
            letter-spacing: 0.16em;
            stroke-dasharray: 1200;
            stroke-dashoffset: 1200;
            will-change: stroke-dashoffset, fill-opacity;
            animation: drawStroke1 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            shape-rendering: geometricPrecision;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .kinetic-stroke-2 {
            font-family: 'Syne', sans-serif;
            font-size: 92px;
            font-weight: 900;
            letter-spacing: 0.22em;
            stroke-dasharray: 1200;
            stroke-dashoffset: 1200;
            will-change: stroke-dashoffset, fill-opacity;
            animation: drawStroke2 2.2s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
            shape-rendering: geometricPrecision;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes drawStroke1 {
            0% {
                stroke-dashoffset: 1200;
                fill-opacity: 0;
            }
            65% {
                stroke-dashoffset: 0;
                fill-opacity: 0;
            }
            100% {
                stroke-dashoffset: 0;
                fill-opacity: 1;
            }
        }

        @keyframes drawStroke2 {
            0% {
                stroke-dashoffset: 1200;
                fill-opacity: 0;
            }
            65% {
                stroke-dashoffset: 0;
                fill-opacity: 0;
            }
            100% {
                stroke-dashoffset: 0;
                fill-opacity: 1;
            }
        }

        /* Subtle Ambient Glow Aura */
        .aura-glow {
            position: absolute;
            width: 480px;
            height: 260px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, rgba(244, 63, 94, 0.04) 50%, transparent 70%);
            filter: blur(40px);
            pointer-events: none;
            z-index: 0;
            animation: pulseAura 3s ease-in-out infinite alternate;
        }

        @keyframes pulseAura {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.15); opacity: 1; }
        }
    </style>
</head>
<body class="bg-white">

    <!-- AMBIENT AURA GLOW -->
    <div class="aura-glow"></div>

    <!-- HIGH-END LUXURY KINETIC DISPLAY -->
    <div class="relative z-10 flex flex-col items-center justify-center w-full h-full my-auto text-center stage-container max-w-3xl px-4">
        
        <svg viewBox="0 0 760 250" class="w-full h-auto max-w-2xl mx-auto overflow-visible select-none pointer-events-none" shape-rendering="geometricPrecision">
          <defs>
            <!-- Iridescent Spectrum Stroke Gradients -->
            <linearGradient id="laser-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#973BED" />
              <stop offset="50%" stop-color="#007CFF" />
              <stop offset="100%" stop-color="#00E0ED" />
            </linearGradient>

            <linearGradient id="laser-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#FF2E93" />
              <stop offset="50%" stop-color="#973BED" />
              <stop offset="100%" stop-color="#007CFF" />
            </linearGradient>

            <!-- Luxury Solid Fill Gradient (Blooms into existence) -->
            <linearGradient id="bloom-fill" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0f172a" />
              <stop offset="50%" stop-color="#1e1b4b" />
              <stop offset="100%" stop-color="#0f172a" />
            </linearGradient>
          </defs>

          <!-- ROW 1: T H A N K (Ultra-Modern Syne 900 Extended) -->
          <text x="390" y="95" text-anchor="middle" class="kinetic-stroke-1" 
                fill="url(#bloom-fill)" stroke="url(#laser-grad-1)" stroke-width="3.2" pathLength="1200">THANK</text>

          <!-- ROW 2: Y O U (Ultra-Modern Syne 900 Extended) -->
          <text x="390" y="200" text-anchor="middle" class="kinetic-stroke-2" 
                fill="url(#bloom-fill)" stroke="url(#laser-grad-2)" stroke-width="3.2" pathLength="1200">YOU</text>
        </svg>

    </div>

    <!-- SCRIPT: AUTO-REDIRECT TO TICKET AFTER ANIMATION COMPLETES (2.4s draw + 1.4s solid hold) -->
    <script>
        setTimeout(() => {
            window.location.replace('thank-you.html');
        }, 3900);
    </script>
</body>
</html>
