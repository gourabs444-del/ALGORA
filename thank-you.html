        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            background-image: 
                radial-gradient(circle at 50% 0%, #ffffff 0%, #edf2f7 65%, #e2e8f0 100%);
        }

        /* ═══════════════════════════════════════════════════════════
           TICKET CARD STATIC ELEGANCE & SOFT DROP SHADOW (NO MOVEMENT)
           ═══════════════════════════════════════════════════════════ */
        .container-cards-ticket {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-ticket {
            position: relative;
            height: auto;
            min-height: 290px;
            width: 100%;
            max-width: 720px;
            display: flex;
            color: #0f172a;
            background: #ffffff;
            border-radius: 1.75rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
            box-shadow: 0 30px 70px -15px rgba(15, 23, 42, 0.15), 0 10px 30px -10px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }

        .card-ticket:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 90px -15px rgba(15, 23, 42, 0.20), 0 15px 40px -10px rgba(0, 0, 0, 0.10), 0 0 0 1px rgba(0, 0, 0, 0.05);
        }

        /* BARCODE SECTION (LEFT STUB) */
        .barcode-section {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 82px;
            padding: 1rem 0.5rem 1rem 1rem;
            flex-shrink: 0;
            background: #ffffff;
        }

        /* PERFORATED NOTCH SEPARATOR (MATCHING PEARLY WHITE BG) */
        .separator {
            position: absolute;
            top: 0;
            left: 82px;
            width: 24px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 20;
            pointer-events: none;
        }

        .separator .span-lines {
            position: relative;
            display: flex;
            height: 100%;
            border-left: 2.5px dashed #cbd5e1;
        }

        .separator .span-lines::after {
            content: "";
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: #f1f5f9;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.10);
        }

        .separator .span-lines::before {
            content: "";
            position: absolute;
            bottom: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: #f1f5f9;
            box-shadow: inset 0 -2px 4px rgba(0, 0, 0, 0.10);
        }

        /* MAIN TICKET CONTENT */
        .content-ticket {
            position: relative;
            justify-content: space-between;
            width: 100%;
            display: flex;
            overflow: hidden;
            background: #ffffff;
        }

        .content-data {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            padding: 1.35rem 1.5rem 1.35rem 1.75rem;
            gap: 0.85rem;
        }

        /* RIGHT ICON COLUMN (THEME GRADIENT) */
        .container-icons {
            width: 62px;
            padding: 1.25rem 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background-color: #2563eb;
            animation: color-card 10s infinite;
            z-index: 5;
            flex-shrink: 0;
        }

        .container-icons .icon {
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes color-card {
            0% {
                background-color: #2563eb;
            }
            25% {
                background-color: #6366f1;
            }
            50% {
                background-color: #9333ea;
            }
            75% {
                background-color: #0284c7;
            }
            100% {
                background-color: #2563eb;
            }
        }
    </style>
</head>

    <!-- LOGIC SCRIPT -->
    <script>
        const leadId = sessionStorage.getItem('inquiryLeadId');
        if (leadId) {
            document.getElementById('lead-id-display').textContent = `ID: #${leadId.replace(/[^0-9A-Za-z]/g, '')}`;
        }

        function copyLeadId() {
            const rawId = sessionStorage.getItem('inquiryLeadId') || (document.getElementById('lead-id-display').textContent.replace(/[^0-9]/g, ''));
            navigator.clipboard.writeText(rawId).then(() => {
                const icon = document.getElementById('copy-icon');
                if (icon) {
                    icon.textContent = 'check';
                    icon.classList.add('text-emerald-600');
                    setTimeout(() => { 
                        icon.textContent = 'content_copy';
                        icon.classList.remove('text-emerald-600');
                    }, 2000);
                }
            }).catch(() => {});
        }
    </script>
