<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You! — Project Submitted</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f17;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.18), transparent 70%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.15), transparent 50%);
        }
        .ty-gradient-bg {
            background: linear-gradient(165deg, 
                #f8fafc 0%, 
                #edf2f7 20%, 
                #c7d2fe 40%, 
                #818cf8 60%, 
                #4f46e5 80%, 
                #3b82f6 100%
            );
        }
        .mesh-grid-overlay {
            background-size: 28px 28px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.18) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.18) 1px, transparent 1px);
        }
        .sparkle-icon {
            font-variation-settings: 'FILL' 1, 'wght' 700;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 overflow-x-hidden">

    <!-- MAIN DESIGN CARD (Matching reference image 1:1) -->
    <div class="relative w-full max-w-[420px] sm:max-w-[460px] rounded-[36px] overflow-hidden shadow-[0_32px_96px_-16px_rgba(99,102,241,0.4)] ty-gradient-bg border border-white/70 p-7 sm:p-9 flex flex-col justify-between min-h-[620px] sm:min-h-[660px]">
        
        <!-- Subtle Background Grid Pattern -->
        <div class="absolute inset-0 mesh-grid-overlay opacity-30 pointer-events-none"></div>

        <!-- TOP BAR -->
        <div class="relative z-10 flex items-center justify-between">
            <div>
                <p class="text-[11px] font-bold tracking-[0.2em] text-[#475569] uppercase">Design Inspiration</p>
            </div>
            <div class="flex items-center gap-1 text-[#4f46e5]">
                <span class="material-symbols-outlined text-[22px] sparkle-icon animate-pulse">sparkles</span>
            </div>
        </div>

        <!-- MAIN HEADLINE -->
        <div class="relative z-10 my-auto pt-2 pb-4">
            <div class="flex items-start justify-between">
                <h1 class="text-6xl sm:text-7xl font-extrabold text-[#0f172a] tracking-tight font-['Outfit'] leading-none">
                    Thank<span class="text-[#4f46e5] inline-block -translate-y-3 text-4xl sm:text-5xl font-normal">✦</span>
                </h1>
            </div>
            <div class="flex items-baseline gap-3 mt-1">
                <span class="text-6xl sm:text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-[#4f46e5] via-[#6366f1] to-[#3b82f6] font-['Outfit'] leading-none">
                    You!
                </span>
                <span class="text-[11px] sm:text-xs font-extrabold tracking-widest text-[#4338ca] uppercase">
                    FOLLOW FOR MORE
                </span>
            </div>

            <!-- MIDDLE HERO TEXT (Matching "Favorite User Interface Typefaces") -->
            <div class="mt-10 space-y-0.5">
                <p class="text-2xl sm:text-3xl font-medium text-white/95 tracking-tight leading-tight">Favorite</p>
                <p class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight leading-tight">User Interface</p>
                <p class="text-3xl sm:text-4xl font-bold text-white/50 tracking-tight leading-tight">Typefaces</p>
            </div>

            <!-- PILL BADGE -->
            <div class="mt-5 inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/20 backdrop-blur-md border border-white/40 shadow-sm text-xs font-semibold text-white">
                <span class="w-4 h-4 rounded-full bg-white/40 flex items-center justify-center text-[10px] text-white">✦</span>
                <span id="lead-id-display">Vasil Enev</span>
            </div>
        </div>

        <!-- LOWER SECTION & ACTION BAR -->
        <div class="relative z-10 space-y-5 pt-4 border-t border-white/20">
            <!-- CALLOUT ROW -->
            <div class="flex items-center justify-between text-[11px] sm:text-xs font-extrabold text-white tracking-wider uppercase">
                <div>FOR YOUR NEXT PROJECTS</div>
                <div>SAVE IT FOR LATER</div>
            </div>

            <!-- BOTTOM BAR -->
            <div class="flex items-center justify-between pt-1">
                <div class="text-[10px] font-bold text-white/80 tracking-wider uppercase leading-snug">
                    <span>FAVORITE UI TYPEFACES</span>
                    <span class="block text-white/60 font-medium">2025 MAY</span>
                </div>
                
                <a href="index.html" class="inline-flex items-center gap-2 bg-white text-[#1e293b] hover:bg-slate-900 hover:text-white px-5 py-3 rounded-2xl font-bold text-xs tracking-wide transition-all shadow-lg hover:scale-105 active:scale-95 group">
                    <span>Back to Home</span>
                    <span class="material-symbols-outlined text-[16px] group-hover:translate-x-0.5 transition-transform">arrow_forward</span>
                </a>
            </div>
        </div>

    </div>

    <script>
        const leadId = sessionStorage.getItem('inquiryLeadId');
        if (leadId) {
            document.getElementById('lead-id-display').textContent = `ID: ${leadId}`;
        }
    </script>
</body>
</html>
