<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You! — Project Confirmed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f17;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.28), transparent 70%),
                radial-gradient(circle at 100% 100%, rgba(56, 189, 248, 0.20), transparent 50%);
        }

        /* ═══════════════════════════════════════════════════════════
           TICKET CARD 3D PERSPECTIVE & ANIMATIONS (UIVERSE COBP)
           ═══════════════════════════════════════════════════════════ */
        .container-cards-ticket {
            perspective: 1200px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-ticket {
            position: relative;
            min-height: 480px;
            width: 100%;
            max-width: 680px;
            display: flex;
            color: #0f172a;
            background: #ffffff;
            border-radius: 2rem;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.25);
            z-index: 10;
            box-shadow: 0 32px 100px -16px rgba(99, 102, 241, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.9);
            animation: animation-card 10s infinite ease-in-out;
            overflow: hidden;
        }

        .card-ticket:hover {
            animation-play-state: paused;
            transform: translateY(-16px) rotateY(-2deg) scale(1.015);
            box-shadow: 0 44px 130px -12px rgba(99, 102, 241, 0.65), 0 0 0 1px rgba(255, 255, 255, 1);
        }

        .card-ticket:hover .content-ticket::after,
        .card-ticket:hover .content-ticket::before,
        .card-ticket:hover .container-icons {
            animation-play-state: paused;
        }

        /* BARCODE SECTION (LEFT STUB) */
        .barcode-section {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem 0.5rem 1.25rem 1rem;
            flex-shrink: 0;
            background: #f8fafc;
            border-right: 1px dashed #e2e8f0;
        }

        /* PERFORATED NOTCH SEPARATOR */
        .separator {
            position: absolute;
            top: 0;
            left: 68px;
            width: 18px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 20;
            pointer-events: none;
        }

        .separator .span-lines {
            position: relative;
            display: flex;
            height: 100%;
            border-left: 2px dashed #cbd5e1;
        }

        .separator .span-lines::after {
            content: "";
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: #0b0f17;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.5);
        }

        .separator .span-lines::before {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: #0b0f17;
            box-shadow: inset 0 -3px 6px rgba(0,0,0,0.5);
        }

        /* MAIN TICKET CONTENT */
        .content-ticket {
            position: relative;
            justify-content: space-between;
            width: 100%;
            display: flex;
            overflow: hidden;
            background: linear-gradient(165deg, #ffffff 0%, #fbfcfe 45%, #f1f5f9 100%);
        }

        .content-ticket::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            background-image: linear-gradient(
                90deg,
                rgba(0, 0, 0, 0),
                rgba(99, 102, 241, 0.12)
            );
            transform: translateX(200px) scale(1.5);
            filter: blur(10px);
            width: 200px;
            height: 100%;
            animation: shadow-card 10s infinite;
            pointer-events: none;
        }

        .content-ticket::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120px;
            background-image: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0),
                rgba(255, 255, 255, 0.85),
                rgba(255, 255, 255, 0)
            );
            transform: translateX(-120px) scale(1.5) rotate(20deg);
            width: 120px;
            height: 100%;
            animation: light-card 10s infinite;
            pointer-events: none;
        }

        .content-data {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            padding: 1.5rem 1.75rem 1.5rem 2rem;
            gap: 1.25rem;
        }

        /* RIGHT ICON COLUMN (THEME GRADIENT) */
        .container-icons {
            width: 54px;
            padding: 1.25rem 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            animation: color-card 10s infinite;
            z-index: 5;
            flex-shrink: 0;
        }

        .container-icons .icon {
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* KEYFRAMES */
        @keyframes animation-card {
            0% {
                transform: translateZ(0px) rotateY(0deg);
            }
            25% {
                transform: translateX(-10px) rotateY(-6deg) rotateX(1.5deg);
            }
            75% {
                transform: translateX(10px) rotateY(6deg) rotateX(-1.5deg);
            }
            100% {
                transform: translateZ(0px) rotateY(0deg);
            }
        }

        @keyframes light-card {
            0%, 15% {
                transform: translateX(-150px) scale(1.5) rotate(25deg);
            }
            45%, 60% {
                transform: translateX(750px) scale(1.5) rotate(25deg);
            }
            100% {
                transform: translateX(750px) scale(1.5) rotate(25deg);
            }
        }

        @keyframes shadow-card {
            0% {
                transform: translateX(350px) scale(1.5);
            }
            35% {
                transform: translateX(50px) scale(1.5);
            }
            75% {
                transform: translateX(350px) scale(1.5);
            }
            100% {
                transform: translateX(350px) scale(1.5);
            }
        }

        @keyframes color-card {
            0% {
                background-color: #2563eb;
            }
            25% {
                background-color: #6366f1;
            }
            50% {
                background-color: #9333ea;
            }
            75% {
                background-color: #0284c7;
            }
            100% {
                background-color: #2563eb;
            }
        }
    </style>
</head>

    <!-- LOGIC SCRIPT -->
    <script>
        const leadId = sessionStorage.getItem('inquiryLeadId');
        if (leadId) {
            document.getElementById('lead-id-display').textContent = `ID: #${leadId.replace(/[^0-9A-Za-z]/g, '')}`;
        }

        function copyLeadId() {
            const rawId = sessionStorage.getItem('inquiryLeadId') || (document.getElementById('lead-id-display').textContent.replace(/[^0-9]/g, ''));
            navigator.clipboard.writeText(rawId).then(() => {
                const icon = document.getElementById('copy-icon');
                if (icon) {
                    icon.textContent = 'check';
                    icon.classList.add('text-emerald-600');
                    setTimeout(() => { 
                        icon.textContent = 'content_copy';
                        icon.classList.remove('text-emerald-600');
                    }, 2000);
                }
            }).catch(() => {});
        }
    </script>
