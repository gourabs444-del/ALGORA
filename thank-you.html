<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You! — Project Confirmed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <!-- Dynamic QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            background-image: 
                radial-gradient(circle at 50% 0%, #ffffff 0%, #edf2f7 65%, #e2e8f0 100%);
        }

        /* ═══════════════════════════════════════════════════════════
           TICKET CONTAINER & REALISTIC PUNCHED HOLE CUTOUT (CSS MASK)
           ═══════════════════════════════════════════════════════════ */
        .container-cards-ticket {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 25px 60px rgba(15, 23, 42, 0.14)) drop-shadow(0 8px 20px rgba(0, 0, 0, 0.06));
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        .container-cards-ticket:hover {
            transform: translateY(-4px);
            filter: drop-shadow(0 35px 80px rgba(15, 23, 42, 0.20)) drop-shadow(0 12px 30px rgba(0, 0, 0, 0.08));
        }

        .card-ticket {
            position: relative;
            height: auto;
            min-height: 290px;
            width: 100%;
            max-width: 740px;
            display: flex;
            color: #0f172a;
            background: #ffffff;
            border-radius: 1.75rem;
            z-index: 10;
            /* Real physical punch hole cutout using CSS Mask aligned at 132px */
            -webkit-mask-image: 
                radial-gradient(circle 15px at 132px 0px, transparent 14.5px, #000 15px),
                radial-gradient(circle 15px at 132px 100%, transparent 14.5px, #000 15px);
            -webkit-mask-composite: source-in;
            mask-image: 
                radial-gradient(circle 15px at 132px 0px, transparent 14.5px, #000 15px),
                radial-gradient(circle 15px at 132px 100%, transparent 14.5px, #000 15px);
            mask-composite: intersect;
        }

        /* QR CODE SECTION (LEFT STUB) */
        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 132px;
            padding: 1.25rem 0.75rem;
            flex-shrink: 0;
            background: #ffffff;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .qr-section:hover {
            background: #f8fafc;
        }

        /* PERFORATED DASHED LINE (PERFECTLY CONNECTING TOP & BOTTOM CUTOUTS) */
        .separator {
            position: absolute;
            top: 15px;
            bottom: 15px;
            left: 132px;
            width: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: none;
            border-left: 2px dashed #cbd5e1;
        }

        .separator .span-lines {
            display: none;
        }

        /* MAIN TICKET CONTENT */
        .content-ticket {
            position: relative;
            justify-content: space-between;
            width: 100%;
            display: flex;
            overflow: hidden;
            background: #ffffff;
        }

        .content-data {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            padding: 1.35rem 1.5rem 1.35rem 1.75rem;
            gap: 0.85rem;
        }

        /* RIGHT ICON COLUMN (THEME GRADIENT) */
        .container-icons {
            width: 62px;
            padding: 1.25rem 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background-color: #2563eb;
            animation: color-card 10s infinite;
            z-index: 5;
            flex-shrink: 0;
        }

        .container-icons .icon {
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes color-card {
            0% {
                background-color: #2563eb;
            }
            25% {
                background-color: #6366f1;
            }
            50% {
                background-color: #9333ea;
            }
            75% {
                background-color: #0284c7;
            }
            100% {
                background-color: #2563eb;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3 overflow-x-hidden">

    <!-- ═══════════════════════════════════════════════════════════════════
         TICKET CONTAINER (GRAND LUXURY 3D BOARDING PASS WITH SCANNABLE QR)
         ═══════════════════════════════════════════════════════════════════ -->
    <div class="container-cards-ticket my-auto px-4">
        <div class="card-ticket">
            
            <!-- LEFT REAL SCANNABLE QR CODE STUB -->
            <a href="track.html" id="qr-track-link" title="Scan or Click to Track Project Status" class="qr-section group">
                <div class="p-1.5 rounded-xl bg-white shadow-xs border border-slate-200/90 group-hover:scale-105 group-hover:border-indigo-400 transition-all duration-200">
                    <canvas id="ticket-qr" class="rounded-lg block"></canvas>
                </div>
                
                <div class="mt-2.5 flex flex-col items-center">
                    <span class="inline-flex items-center gap-1 text-[8.5px] font-extrabold tracking-wider text-indigo-700 uppercase group-hover:text-indigo-900 transition-colors">
                        <span class="material-symbols-outlined text-[11px]">qr_code_scanner</span>
                        <span>SCAN TO TRACK</span>
                    </span>
                    <span class="text-[8px] font-mono font-bold text-slate-400 mt-0.5">LIVE CLOUD</span>
                </div>
            </a>

            <!-- NOTCH SEPARATOR -->
            <div class="separator">
                <span class="span-lines"></span>
            </div>

            <!-- TICKET BODY CONTENT -->
            <div class="content-ticket">
                <div class="content-data">
                    
                    <!-- TOP BAR: GREEN CAPSULE BADGE + LOGO -->
                    <div class="flex items-center justify-between">
                        <div class="inline-flex items-center px-3 py-1 rounded-full bg-emerald-500/15 border border-emerald-500/30">
                            <span class="text-[10px] font-extrabold tracking-widest text-emerald-800 uppercase">SUBMITTED</span>
                        </div>
                        <img src="assets/logo.png" alt="ALGORA" class="h-5 sm:h-6 w-auto object-contain" style="filter: brightness(0.12) contrast(1.4) opacity(0.9) !important;" />
                    </div>

                    <!-- MAIN HEADLINE & CRAFT STATEMENT -->
                    <div class="my-auto py-1">
                        <div class="flex items-baseline gap-2 leading-none">
                            <h1 class="text-3xl sm:text-4.5xl font-extrabold text-[#111625] tracking-tight font-['Outfit']">
                                Thank
                            </h1>
                            <h1 class="text-3xl sm:text-4.5xl font-extrabold text-[#6366f1] tracking-tight font-['Outfit']">
                                You!
                            </h1>
                            <span class="text-[10px] sm:text-xs font-extrabold tracking-wider text-indigo-600 uppercase ml-2">✦ WE'LL BE IN TOUCH</span>
                        </div>

                        <div class="text-sm sm:text-lg font-semibold text-slate-500 leading-snug mt-2">
                            Crafting <span class="text-slate-900 font-extrabold">High-Impact</span> Digital Experiences
                        </div>
                    </div>

                    <div style="border-bottom: 1.5px dashed #e2e8f0;"></div>

                    <!-- BOTTOM METADATA & ACTIONS -->
                    <div class="flex items-center justify-between pt-1">
                        <button id="copy-lead-id-btn" onclick="copyLeadId()" title="Click to copy" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-slate-100 hover:bg-slate-200 border border-slate-300 text-xs font-mono font-bold text-slate-800 transition-all cursor-pointer">
                            <span id="lead-id-display">Inquiry Confirmed</span>
                            <span class="material-symbols-outlined text-[14px] text-slate-500" id="copy-icon">content_copy</span>
                        </button>

                        <a href="projects.html" class="inline-flex items-center gap-1.5 bg-[#0f172a] text-white hover:bg-indigo-600 px-4 py-2 rounded-xl font-bold text-xs tracking-wider uppercase transition-all shadow-md active:scale-95">
                            <span>Back to Home</span>
                            <span class="material-symbols-outlined text-[14px]">arrow_forward</span>
                        </a>
                    </div>

                </div>

                <!-- RIGHT SIDE ANIMATED COLOR STRIP (EXACT SCREENSHOT STYLE) -->
                <div class="container-icons">
                    <div class="icon">
                        <span class="text-base select-none">✦</span>
                    </div>

                    <!-- Center Monogram -->
                    <div class="text-white/95 font-mono font-black text-xs tracking-widest rotate-90 my-auto select-none">
                        ALGORA
                    </div>

                    <!-- Bottom Badge Icon -->
                    <div class="icon">
                        <span class="text-sm select-none">✦</span>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- LOGIC SCRIPT (REAL QR CODE & CLOUD TRACKING SYNC) -->
    <script>
        const rawSessionLeadId = sessionStorage.getItem('inquiryLeadId');
        const cleanLeadId = rawSessionLeadId ? rawSessionLeadId.replace(/[^0-9A-Za-z]/g, '') : 'AG-9421';
        const formattedLeadId = cleanLeadId.startsWith('AG-') ? `#${cleanLeadId}` : `#AG-${cleanLeadId}`;

        document.getElementById('lead-id-display').textContent = `ID: ${formattedLeadId}`;

        // Construct Cloud Tracking URL for QR code
        let baseUrl = window.location.href.split('?')[0];
        if (baseUrl.endsWith('thank-you.html')) {
            baseUrl = baseUrl.replace('thank-you.html', 'track.html');
        } else {
            baseUrl = baseUrl.substring(0, baseUrl.lastIndexOf('/') + 1) + 'track.html';
        }
        const trackingUrl = `${baseUrl}?id=${encodeURIComponent(cleanLeadId)}`;

        // Update link
        const qrLink = document.getElementById('qr-track-link');
        if (qrLink) {
            qrLink.href = trackingUrl;
        }

        // Generate high-resolution scannable QR Code
        try {
            new QRious({
                element: document.getElementById('ticket-qr'),
                value: trackingUrl,
                size: 96,
                level: 'H',
                foreground: '#0f172a',
                background: '#ffffff'
            });
        } catch(e) {
            console.error('QR Generator error:', e);
        }

        function copyLeadId() {
            const rawId = formattedLeadId;
            navigator.clipboard.writeText(rawId).then(() => {
                const icon = document.getElementById('copy-icon');
                if (icon) {
                    icon.textContent = 'check';
                    icon.classList.add('text-emerald-600');
                    setTimeout(() => { 
                        icon.textContent = 'content_copy';
                        icon.classList.remove('text-emerald-600');
                    }, 2000);
                }
            }).catch(() => {});
        }
    </script>
</body>
</html>
