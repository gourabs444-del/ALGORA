<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You! — Project Confirmed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <!-- Dynamic QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #e2e8f0;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 55%),
                radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.10) 0px, transparent 55%),
                radial-gradient(circle at 50% 50%, #edf2f7 0%, #e2e8f0 60%, #cbd5e1 100%);
            min-height: 100vh;
        }

        /* ═══════════════════════════════════════════════════════════
           TICKET CONTAINER & GRAND 3D PHYSICAL STUDIO SHADOWS
           ═══════════════════════════════════════════════════════════ */
        .ticket-3d-wrapper {
            position: relative;
            width: 100%;
            max-width: 740px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
        }

        /* 3D Physical Ground / Floor Contact Shadow (True Ambient Depth) */
        .ticket-floor-shadow {
            position: absolute;
            bottom: -20px;
            left: 6%;
            width: 88%;
            height: 45px;
            background: radial-gradient(ellipse at center, rgba(15, 23, 42, 0.50) 0%, rgba(30, 27, 75, 0.30) 45%, transparent 75%);
            filter: blur(16px);
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .container-cards-ticket {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
            filter: 
                drop-shadow(0 20px 25px rgba(15, 23, 42, 0.22))
                drop-shadow(0 8px 12px rgba(15, 23, 42, 0.15))
                drop-shadow(0 2px 4px rgba(0, 0, 0, 0.08));
            transition: filter 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .ticket-3d-wrapper:hover .container-cards-ticket {
            transform: translateY(-8px) scale(1.008);
            filter: 
                drop-shadow(0 32px 45px rgba(15, 23, 42, 0.28))
                drop-shadow(0 15px 22px rgba(79, 70, 229, 0.22))
                drop-shadow(0 4px 8px rgba(0, 0, 0, 0.10));
        }

        .ticket-3d-wrapper:hover .ticket-floor-shadow {
            transform: scale(1.06) translateY(6px);
            opacity: 0.85;
            filter: blur(20px);
        }

        /* Real physical punch hole cutout using CSS Mask aligned at 132px */
        .card-ticket {
            position: relative;
            height: auto;
            min-height: 290px;
            width: 100%;
            max-width: 740px;
            display: flex;
            color: #0f172a;
            background: #ffffff;
            border-radius: 1.75rem;
            box-shadow: inset 0 0 0 1px rgba(226, 232, 240, 0.85);
            z-index: 10;
            -webkit-mask-image: 
                radial-gradient(circle 14.5px at 132px 0px, transparent 14px, #000 14.5px),
                radial-gradient(circle 14.5px at 132px 100%, transparent 14px, #000 14.5px);
            -webkit-mask-composite: source-in;
            mask-image: 
                radial-gradient(circle 14.5px at 132px 0px, transparent 14.5px, #000 15px),
                radial-gradient(circle 14.5px at 132px 100%, transparent 14.5px, #000 15px);
            mask-composite: intersect;
        }

        /* QR CODE SECTION (LEFT STUB) */
        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 132px;
            padding: 1.25rem 0.75rem;
            flex-shrink: 0;
            background: #ffffff;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s ease;
            position: relative;
            z-index: 10;
        }

        .qr-section:hover {
            background: #f8fafc;
        }

        /* PERFORATED DASHED LINE (CONNECTING TOP & BOTTOM CUTOUTS) */
        .separator {
            position: absolute;
            top: 14px;
            bottom: 14px;
            left: 132px;
            width: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: none;
            border-left: 2px dashed #cbd5e1;
        }

        /* MAIN TICKET CONTENT */
        .content-ticket {
            position: relative;
            justify-content: space-between;
            width: 100%;
            display: flex;
            background: #ffffff;
            z-index: 10;
        }

        .content-data {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            padding: 1.35rem 1.5rem 1.35rem 1.75rem;
            gap: 0.85rem;
        }

        /* RIGHT ICON COLUMN (LUXURY STUDIO GRADIENT) */
        .container-icons {
            width: 58px;
            padding: 1.4rem 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(180deg, #1e1b4b 0%, #312e81 40%, #4338ca 75%, #2563eb 100%);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 15;
            flex-shrink: 0;
        }

        /* PIXEL-PERFECT BADGES & PILLS */
        .submitted-capsule {
            display: inline-table;
            vertical-align: middle;
            background-color: #059669;
            border-radius: 9999px;
            height: 22px;
            padding: 0 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .pill-capsule {
            display: inline-table;
            vertical-align: middle;
            background-color: #f8fafc;
            border: 1px solid rgba(226, 232, 240, 0.95);
            border-radius: 9999px;
            height: 28px;
            padding: 0 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            cursor: pointer;
        }

        /* CINEMATIC SMOOTH ENTRY ANIMATION */
        .ticket-smooth-enter {
            opacity: 0;
            transform: translateY(35px) scale(0.94);
            filter: blur(8px);
            animation: ticketGlideIn 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
        }

        @keyframes ticketGlideIn {
            0% {
                opacity: 0;
                transform: translateY(35px) scale(0.94);
                filter: blur(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0px);
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3 overflow-x-hidden">

    <!-- ═══════════════════════════════════════════════════════════════════
         TICKET CONTAINER (GRAND LUXURY 3D BOARDING PASS WITH SCANNABLE QR)
         ═══════════════════════════════════════════════════════════════════ -->
    <div class="ticket-3d-wrapper ticket-smooth-enter my-auto px-4">
        <!-- 3D Ground Floor Contact Shadow -->
        <div class="ticket-floor-shadow"></div>

        <!-- 3D Ticket Container -->
        <div class="container-cards-ticket">
            <div id="ticketCard" class="card-ticket">
            
            <!-- LEFT REAL SCANNABLE QR CODE STUB -->
            <a href="track.html" id="qr-track-link" title="Scan or Click to Track Project Status" class="qr-section group">
                <div class="p-1.5 rounded-xl bg-white shadow-xs border border-slate-200/90 group-hover:scale-105 group-hover:border-indigo-400 transition-all duration-200">
                    <canvas id="ticket-qr" class="rounded-lg block"></canvas>
                </div>
                
                <div class="mt-2.5 flex flex-col items-center">
                    <span class="inline-flex items-center gap-1 text-[8.5px] font-extrabold tracking-wider text-indigo-700 uppercase group-hover:text-indigo-900 transition-colors">
                        <span class="material-symbols-outlined text-[11px]">qr_code_scanner</span>
                        <span>SCAN TO TRACK</span>
                    </span>
                    <span class="text-[8px] font-mono font-bold text-slate-400 mt-0.5">LIVE CLOUD</span>
                </div>
            </a>

            <!-- NOTCH SEPARATOR -->
            <div id="notchSeparator" class="separator"></div>

            <!-- TICKET BODY CONTENT -->
            <div class="content-ticket">
                <div class="content-data">
                    
                    <!-- TOP BAR: SOLID GREEN CAPSULE BADGE + LOGO -->
                    <div class="flex items-center justify-between">
                        <div class="submitted-capsule">
                            <div style="display: table-cell; vertical-align: middle; text-align: center;">
                                <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 9.5px; font-weight: 800; letter-spacing: 0.14em; color: #ffffff; text-transform: uppercase; line-height: 1; display: block;">SUBMITTED</span>
                            </div>
                        </div>
                        <img src="assets/algora-logo.svg" alt="ALGORA" class="h-4 sm:h-4.5 w-auto object-contain" />
                    </div>

                    <!-- MAIN HEADLINE & CRAFT STATEMENT -->
                    <div class="my-auto py-1">
                        <div class="flex items-baseline gap-2 leading-none">
                            <h1 class="text-3xl sm:text-4.5xl font-extrabold text-[#111625] tracking-tight font-['Outfit']">
                                Thank
                            </h1>
                            <h1 class="text-3xl sm:text-4.5xl font-extrabold text-[#6366f1] tracking-tight font-['Outfit']">
                                You!
                            </h1>
                            <span class="text-[10px] sm:text-xs font-extrabold tracking-wider text-indigo-600 uppercase ml-2">✦ WE'LL BE IN TOUCH</span>
                        </div>

                        <div class="text-sm sm:text-lg font-semibold text-slate-500 leading-snug mt-2">
                            Crafting <span class="text-slate-900 font-extrabold">High-Impact</span> Digital Experiences
                        </div>
                    </div>

                    <div style="border-bottom: 1.5px dashed #e2e8f0;"></div>

                    <!-- BOTTOM METADATA & ACTIONS -->
                    <div class="flex items-center justify-between pt-1 gap-2 min-h-[32px]">
                        <!-- CLEAN NUMERIC ORDER ID PILL (PERFECTLY CENTERED) -->
                        <div id="copy-lead-id-btn" onclick="copyLeadId()" title="Click to copy Order ID" class="pill-capsule group">
                            <div style="display: table-cell; vertical-align: middle; padding-right: 6px; line-height: 0;">
                                <svg width="6" height="6" viewBox="0 0 6 6" style="display: block;">
                                    <circle cx="3" cy="3" r="3" fill="#10b981"/>
                                </svg>
                            </div>
                            <div style="display: table-cell; vertical-align: middle; padding-right: 6px;">
                                <span id="lead-id-display" style="font-family: 'Plus Jakarta Sans', monospace, sans-serif; font-size: 11.5px; font-weight: 700; color: #334155; line-height: 1; display: block; letter-spacing: 0.02em;">202508249421</span>
                            </div>
                            <div style="display: table-cell; vertical-align: middle; line-height: 0;">
                                <svg id="copy-svg-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display: block;" class="group-hover:stroke-slate-700 transition-colors">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                            </div>
                        </div>

                        <!-- RIGHT AREA: HOME NAVIGATION BUTTON -->
                        <div class="flex items-center">
                            <a href="projects.html" class="inline-flex items-center gap-1.5 bg-[#0f172a] hover:bg-indigo-600 text-white px-4 py-1.5 rounded-xl font-bold text-xs tracking-wider uppercase transition-all shadow-md active:scale-95 group">
                                <span class="material-symbols-outlined text-[14px]">home</span>
                                <span>Home</span>
                            </a>
                        </div>
                    </div>

                </div>

                <!-- RIGHT SIDE PROJECT PASS TICKET STUB -->
                <div class="container-icons">
                    <!-- Top Verified Notch / Icon -->
                    <div class="flex flex-col items-center select-none text-white/90 pt-1">
                        <span class="material-symbols-outlined text-[15px]">verified</span>
                        <span class="text-[6.5px] font-mono font-extrabold tracking-widest text-indigo-200 uppercase mt-0.5">VERIFIED</span>
                    </div>

                    <!-- Center Rotated Clean Small Project Pass Text -->
                    <div class="my-auto py-2">
                        <span class="text-white/90 font-mono font-bold text-[8.5px] tracking-[0.28em] rotate-90 block my-auto select-none uppercase whitespace-nowrap">
                            PROJECT PASS
                        </span>
                    </div>

                    <!-- Bottom Studio Security Details -->
                    <div class="flex flex-col items-center select-none pb-1 text-center">
                        <span class="text-[6.5px] font-mono font-extrabold tracking-widest text-indigo-200 uppercase">SECURED</span>
                        <span class="text-[8px] font-mono font-black text-white tracking-widest mt-0.5">INTAKE</span>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

    <!-- LOGIC SCRIPT (REAL QR CODE & CLOUD TRACKING SYNC) -->
    <script>
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const datePrefix = `${yyyy}${mm}${dd}`;

        const rawSessionLeadId = sessionStorage.getItem('inquiryLeadId');
        const numericDigits = rawSessionLeadId ? rawSessionLeadId.replace(/[^0-9]/g, '') : '9421';
        const cleanNumericId = numericDigits.length >= 8 ? numericDigits : `${datePrefix}${numericDigits || '9421'}`;

        document.getElementById('lead-id-display').textContent = cleanNumericId;

        let baseUrl = window.location.href.split('?')[0];
        if (baseUrl.endsWith('thank-you.html')) {
            baseUrl = baseUrl.replace('thank-you.html', 'track.html');
        } else {
            baseUrl = baseUrl.substring(0, baseUrl.lastIndexOf('/') + 1) + 'track.html';
        }
        const trackingUrl = `${baseUrl}?id=${encodeURIComponent(cleanNumericId)}`;

        const qrLink = document.getElementById('qr-track-link');
        if (qrLink) {
            qrLink.href = trackingUrl;
        }

        try {
            new QRious({
                element: document.getElementById('ticket-qr'),
                value: trackingUrl,
                size: 96,
                level: 'H',
                foreground: '#0f172a',
                background: '#ffffff'
            });
        } catch(e) {
            console.error('QR Generator error:', e);
        }

        function copyLeadId() {
            const rawId = cleanNumericId;
            if (window.Analytics) {
                window.Analytics.trackEvent('copy_lead_reference', { lead_id: rawId });
            }
            navigator.clipboard.writeText(rawId).then(() => {
                const iconSvg = document.getElementById('copy-svg-icon');
                if (iconSvg) {
                    iconSvg.innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';
                    iconSvg.setAttribute('stroke', '#10b981');
                    setTimeout(() => { 
                        iconSvg.innerHTML = '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>';
                        iconSvg.setAttribute('stroke', '#94a3b8');
                    }, 2000);
                }
            }).catch(() => {});
        }

        // GA4 Primary Conversion Confirmation
        window.addEventListener('DOMContentLoaded', () => {
            if (window.Analytics) {
                window.Analytics.trackConversion('conversion_complete', {
                    lead_reference_id: cleanNumericId,
                    destination: 'thank_you_ticket'
                });
            }
        });
    </script>

    <!-- Google Analytics 4 (GA4) -->
    <script src="js/analytics-config.js" defer></script>
    <script src="js/analytics.js"        defer></script>
</body>
</html>
