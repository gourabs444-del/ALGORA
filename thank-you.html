<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You! — Project Confirmed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <!-- Dynamic QR Code & Canvas Export Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            background-image: 
                radial-gradient(circle at 50% 0%, #ffffff 0%, #edf2f7 65%, #e2e8f0 100%);
        }

        /* ═══════════════════════════════════════════════════════════
           TICKET CONTAINER & REALISTIC PUNCHED HOLE CUTOUT (CSS MASK)
           ═══════════════════════════════════════════════════════════ */
        .container-cards-ticket {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 25px 60px rgba(15, 23, 42, 0.14)) drop-shadow(0 8px 20px rgba(0, 0, 0, 0.06));
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        .container-cards-ticket:hover {
            transform: translateY(-4px);
            filter: drop-shadow(0 35px 80px rgba(15, 23, 42, 0.20)) drop-shadow(0 12px 30px rgba(0, 0, 0, 0.08));
        }

        .card-ticket {
            position: relative;
            height: auto;
            min-height: 290px;
            width: 100%;
            max-width: 740px;
            display: flex;
            color: #0f172a;
            background: #ffffff;
            border-radius: 1.75rem;
            z-index: 10;
            /* Real physical punch hole cutout using CSS Mask aligned at 132px */
            -webkit-mask-image: 
                radial-gradient(circle 15px at 132px 0px, transparent 14.5px, #000 15px),
                radial-gradient(circle 15px at 132px 100%, transparent 14.5px, #000 15px);
            -webkit-mask-composite: source-in;
            mask-image: 
                radial-gradient(circle 15px at 132px 0px, transparent 14.5px, #000 15px),
                radial-gradient(circle 15px at 132px 100%, transparent 14.5px, #000 15px);
            mask-composite: intersect;
        }

        /* QR CODE SECTION (LEFT STUB) */
        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 132px;
            padding: 1.25rem 0.75rem;
            flex-shrink: 0;
            background: #ffffff;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .qr-section:hover {
            background: #f8fafc;
        }

        /* PERFORATED DASHED LINE (PERFECTLY CONNECTING TOP & BOTTOM CUTOUTS) */
        .separator {
            position: absolute;
            top: 15px;
            bottom: 15px;
            left: 132px;
            width: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: none;
            border-left: 2px dashed #cbd5e1;
        }

        .separator .span-lines {
            display: none;
        }

        /* MAIN TICKET CONTENT */
        .content-ticket {
            position: relative;
            justify-content: space-between;
            width: 100%;
            display: flex;
            overflow: hidden;
            background: #ffffff;
        }

        .content-data {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            padding: 1.35rem 1.5rem 1.35rem 1.75rem;
            gap: 0.85rem;
        }

        /* RIGHT ICON COLUMN (LUXURY STUDIO GRADIENT) */
        .container-icons {
            width: 58px;
            padding: 1.4rem 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(180deg, #1e1b4b 0%, #312e81 40%, #4338ca 75%, #2563eb 100%);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 5;
            flex-shrink: 0;
        }
        /* ═══════════════════════════════════════════════════════════
           CINEMATIC SMOOTH ENTRY ANIMATION (TICKET & ACTIONS)
           ═══════════════════════════════════════════════════════════ */
        .ticket-smooth-enter {
            opacity: 0;
            transform: translateY(35px) scale(0.94);
            filter: blur(8px);
            animation: ticketGlideIn 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
        }

        .actions-smooth-enter {
            opacity: 0;
            transform: translateY(20px);
            animation: actionsGlideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.28s forwards;
        }

        @keyframes ticketGlideIn {
            0% {
                opacity: 0;
                transform: translateY(35px) scale(0.94);
                filter: blur(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0px);
            }
        }

        @keyframes actionsGlideIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3 overflow-x-hidden">

    <!-- ═══════════════════════════════════════════════════════════════════
         TICKET CONTAINER (GRAND LUXURY 3D BOARDING PASS WITH SCANNABLE QR)
         ═══════════════════════════════════════════════════════════════════ -->
    <div class="container-cards-ticket ticket-smooth-enter my-auto px-4">
        <div class="card-ticket">
            
            <!-- LEFT REAL SCANNABLE QR CODE STUB -->
            <a href="track.html" id="qr-track-link" title="Scan or Click to Track Project Status" class="qr-section group">
                <div class="p-1.5 rounded-xl bg-white shadow-xs border border-slate-200/90 group-hover:scale-105 group-hover:border-indigo-400 transition-all duration-200">
                    <canvas id="ticket-qr" class="rounded-lg block"></canvas>
                </div>
                
                <div class="mt-2.5 flex flex-col items-center">
                    <span class="inline-flex items-center gap-1 text-[8.5px] font-extrabold tracking-wider text-indigo-700 uppercase group-hover:text-indigo-900 transition-colors">
                        <span class="material-symbols-outlined text-[11px]">qr_code_scanner</span>
                        <span>SCAN TO TRACK</span>
                    </span>
                    <span class="text-[8px] font-mono font-bold text-slate-400 mt-0.5">LIVE CLOUD</span>
                </div>
            </a>

            <!-- NOTCH SEPARATOR -->
            <div class="separator">
                <span class="span-lines"></span>
            </div>

            <!-- TICKET BODY CONTENT -->
            <div class="content-ticket">
                <div class="content-data">
                    
                    <!-- TOP BAR: SOLID GREEN CAPSULE BADGE + LOGO -->
                    <div class="flex items-center justify-between">
                        <div class="inline-flex items-center px-3 py-1 rounded-full bg-emerald-600 shadow-xs">
                            <span class="text-[9.5px] font-extrabold tracking-widest text-white uppercase">SUBMITTED</span>
                        </div>
                        <img src="assets/logo.png" alt="ALGORA" class="h-5 sm:h-6 w-auto object-contain" style="filter: brightness(0.12) contrast(1.4) opacity(0.9) !important;" />
                    </div>

                    <!-- MAIN HEADLINE & CRAFT STATEMENT -->
                    <div class="my-auto py-1">
                        <div class="flex items-baseline gap-2 leading-none">
                            <h1 class="text-3xl sm:text-4.5xl font-extrabold text-[#111625] tracking-tight font-['Outfit']">
                                Thank
                            </h1>
                            <h1 class="text-3xl sm:text-4.5xl font-extrabold text-[#6366f1] tracking-tight font-['Outfit']">
                                You!
                            </h1>
                            <span class="text-[10px] sm:text-xs font-extrabold tracking-wider text-indigo-600 uppercase ml-2">✦ WE'LL BE IN TOUCH</span>
                        </div>

                        <div class="text-sm sm:text-lg font-semibold text-slate-500 leading-snug mt-2">
                            Crafting <span class="text-slate-900 font-extrabold">High-Impact</span> Digital Experiences
                        </div>
                    </div>

                    <div style="border-bottom: 1.5px dashed #e2e8f0;"></div>

                    <!-- BOTTOM METADATA & ACTIONS -->
                    <div class="flex items-center justify-between pt-1 gap-2">
                        <!-- CLEAN NUMERIC ORDER ID PILL -->
                        <button id="copy-lead-id-btn" onclick="copyLeadId()" title="Click to copy Order ID" class="inline-flex items-center gap-1.5 sm:gap-2 px-2.5 sm:px-3.5 py-1.5 rounded-full bg-slate-50 hover:bg-slate-100 border border-slate-200/80 text-[11px] sm:text-xs font-mono font-bold text-slate-700 transition-all cursor-pointer group shadow-2xs">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                            <span id="lead-id-display">202508249421</span>
                            <span class="material-symbols-outlined text-[13px] text-slate-400 group-hover:text-slate-700 transition-colors" id="copy-icon">content_copy</span>
                        </button>

                        <!-- RIGHT ACTION BUTTONS: HOME & ICON-ONLY DOWNLOAD PASS -->
                        <div class="flex items-center gap-1.5 sm:gap-2">
                            <!-- HOME BUTTON (SLIDED LEFT) -->
                            <a href="projects.html" title="Back to Showcase" class="inline-flex items-center gap-1 bg-slate-100 hover:bg-slate-200 text-slate-800 px-3 py-1.5 rounded-xl font-bold text-xs tracking-wider uppercase transition-all shadow-2xs active:scale-95 group">
                                <span class="material-symbols-outlined text-[14px]">home</span>
                                <span>Home</span>
                            </a>

                            <!-- ICON-ONLY DOWNLOAD PROJECT PASS BUTTON -->
                            <button id="download-pass-btn" onclick="downloadProjectPass()" title="Download Project Pass" class="inline-flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 bg-[#0f172a] hover:bg-indigo-600 text-white rounded-xl transition-all shadow-md active:scale-95 cursor-pointer group flex-shrink-0">
                                <span class="material-symbols-outlined text-[16px] sm:text-[18px] group-hover:-translate-y-0.5 transition-transform" id="download-icon">download</span>
                            </button>
                        </div>
                    </div>

                </div>

                <!-- RIGHT SIDE PROJECT PASS TICKET STUB -->
                <div class="container-icons">
                    <!-- Top Verified Notch / Icon -->
                    <div class="flex flex-col items-center select-none text-white/90 pt-1">
                        <span class="material-symbols-outlined text-[15px]">verified</span>
                        <span class="text-[6.5px] font-mono font-extrabold tracking-widest text-indigo-200 uppercase mt-0.5">VERIFIED</span>
                    </div>

                    <!-- Center Rotated Clean Small Project Pass Text -->
                    <div class="my-auto py-2">
                        <span class="text-white/90 font-mono font-bold text-[8.5px] tracking-[0.28em] rotate-90 block my-auto select-none uppercase whitespace-nowrap">
                            PROJECT PASS
                        </span>
                    </div>

                    <!-- Bottom Studio Security Details -->
                    <div class="flex flex-col items-center select-none pb-1 text-center">
                        <span class="text-[6.5px] font-mono font-extrabold tracking-widest text-indigo-200 uppercase">SECURED</span>
                        <span class="text-[8px] font-mono font-black text-white tracking-widest mt-0.5">INTAKE</span>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- LOGIC SCRIPT (REAL QR CODE & CLOUD TRACKING SYNC & PASS DOWNLOAD) -->
    <script>
        // Generate Date-Encoded Pure Numeric Order ID (YYYYMMDDXXXX)
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const datePrefix = `${yyyy}${mm}${dd}`;

        const rawSessionLeadId = sessionStorage.getItem('inquiryLeadId');
        const numericDigits = rawSessionLeadId ? rawSessionLeadId.replace(/[^0-9]/g, '') : '9421';
        const cleanNumericId = numericDigits.length >= 8 ? numericDigits : `${datePrefix}${numericDigits || '9421'}`;

        document.getElementById('lead-id-display').textContent = cleanNumericId;

        // Construct Cloud Tracking URL for QR code
        let baseUrl = window.location.href.split('?')[0];
        if (baseUrl.endsWith('thank-you.html')) {
            baseUrl = baseUrl.replace('thank-you.html', 'track.html');
        } else {
            baseUrl = baseUrl.substring(0, baseUrl.lastIndexOf('/') + 1) + 'track.html';
        }
        const trackingUrl = `${baseUrl}?id=${encodeURIComponent(cleanNumericId)}`;

        // Update link
        const qrLink = document.getElementById('qr-track-link');
        if (qrLink) {
            qrLink.href = trackingUrl;
        }

        // Generate high-resolution scannable QR Code
        try {
            new QRious({
                element: document.getElementById('ticket-qr'),
                value: trackingUrl,
                size: 96,
                level: 'H',
                foreground: '#0f172a',
                background: '#ffffff'
            });
        } catch(e) {
            console.error('QR Generator error:', e);
        }

        function copyLeadId() {
            const rawId = cleanNumericId;
            navigator.clipboard.writeText(rawId).then(() => {
                const icon = document.getElementById('copy-icon');
                if (icon) {
                    icon.textContent = 'check';
                    icon.classList.add('text-emerald-600');
                    setTimeout(() => { 
                        icon.textContent = 'content_copy';
                        icon.classList.remove('text-emerald-600');
                    }, 2000);
                }
            }).catch(() => {});
        }

        // High-Resolution Project Pass PNG Exporter (Icon-Only Trigger)
        function downloadProjectPass() {
            const btn = document.getElementById('download-pass-btn');
            const icon = document.getElementById('download-icon');
            const ticketEl = document.querySelector('.card-ticket');

            if (!ticketEl) return;

            icon.textContent = 'hourglass_top';
            btn.disabled = true;

            html2canvas(ticketEl, {
                scale: 3, // Retina 3x crystal-clear export
                useCORS: true,
                backgroundColor: null,
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Algora-Project-Pass-${cleanNumericId}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                icon.textContent = 'check';
                setTimeout(() => {
                    icon.textContent = 'download';
                    btn.disabled = false;
                }, 2000);
            }).catch(err => {
                console.error('Ticket download error:', err);
                icon.textContent = 'download';
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
